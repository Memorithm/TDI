<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title desc">
  <title id="title">TDI mathematical bench atlas</title>
  <desc id="desc">Seven compact mathematical signature cards for the principal TDI research bench families.</desc>
  <rect width="1400" height="1060" rx="28" fill="#ffffff"/>
  <text x="60" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="700" fill="#111827">TDI — Mathematical bench atlas</text>
  <text x="60" y="108" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" fill="#64748b">Representative signatures only — canonical protocols remain in docs/</text>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect x="50" y="145" width="630" height="190" rx="20" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="82" y="185" font-size="21" font-weight="700" fill="#0f172a">TDI-1 → TDI-7 · dynamics, recovery &amp; attention</text>
    <text x="82" y="235" font-size="27" fill="#111827">Uₕ = −log₂(1 − Oₕ)</text>
    <text x="82" y="282" font-size="25" fill="#111827">r_MSE = (MSE_B0 − MSE_B1) / MSE_B0</text>
    <text x="82" y="315" font-size="16" fill="#64748b">Predictive value beyond competent controls.</text>

    <rect x="720" y="145" width="630" height="190" rx="20" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="752" y="185" font-size="21" font-weight="700" fill="#0f172a">TDI-8 → TDI-9 · bounded architectures &amp; inference</text>
    <text x="752" y="235" font-size="27" fill="#111827">M_A1 = M_A2 = M_A3</text>
    <text x="752" y="282" font-size="25" fill="#111827">pₜ = P(observationₜ)   ·   aₜ = F_bool(pₜ)</text>
    <text x="752" y="315" font-size="16" fill="#64748b">Matched memory and compute envelopes.</text>

    <rect x="50" y="365" width="630" height="190" rx="20" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="82" y="405" font-size="21" font-weight="700" fill="#0f172a">TDI-10 / TDI-12 · operators &amp; ordinal transport</text>
    <text x="82" y="455" font-size="27" fill="#111827">Σₖ (1 − αₖ) = ∞   ⇔   Πₖ αₖ → 0</text>
    <text x="82" y="502" font-size="25" fill="#111827">ρ_S = corr(rank(x), rank(y))</text>
    <text x="82" y="535" font-size="16" fill="#64748b">Exact operator laws and transport of ordering.</text>

    <rect x="720" y="365" width="630" height="190" rx="20" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="752" y="405" font-size="21" font-weight="700" fill="#0f172a">TDI-11 · hallucination dynamics &amp; control</text>
    <text x="752" y="455" font-size="25" fill="#111827">aₜ ∈ { CONTINUE, VERIFY, RECOVER,</text>
    <text x="752" y="493" font-size="25" fill="#111827">        EMIT, ABSTAIN }</text>
    <text x="752" y="535" font-size="16" fill="#64748b">Prospective intervention before unsupported output.</text>

    <rect x="50" y="585" width="630" height="250" rx="20" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="82" y="625" font-size="21" font-weight="700" fill="#0f172a">TDI-21 → TDI-25 · alternative representations</text>
    <text x="82" y="674" font-size="23" fill="#111827">ANF:  f(x) = ⊕_S a_S Π_(i∈S) xᵢ</text>
    <text x="82" y="716" font-size="23" fill="#111827">Torsor:  s_T = (v + Q × ω) · R + ω · C</text>
    <text x="82" y="758" font-size="23" fill="#111827">Categorical:  R(f) = E_K† f E_H</text>
    <text x="82" y="800" font-size="23" fill="#111827">Chiral:  χ(q,k) = qᵀJk,  χ(Mq,Mk) = −χ(q,k)</text>

    <rect x="720" y="585" width="630" height="115" rx="20" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="752" y="625" font-size="21" font-weight="700" fill="#0f172a">TDI-26 · sparse recurrent topology</text>
    <text x="752" y="672" font-size="22" fill="#111827">G_V888 vs G_random · G_degree · G_reciprocity · G_modularity</text>

    <rect x="720" y="720" width="630" height="115" rx="20" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="752" y="760" font-size="21" font-weight="700" fill="#0f172a">TDI-27 · latent concept geometry</text>
    <text x="752" y="804" font-size="23" fill="#111827">v = μ_P − μ_C   ·   r = (I − P_U)v   ·   I = ||r||² / ||v||²</text>

    <rect x="50" y="875" width="1300" height="120" rx="20" fill="#f1f5f9" stroke="#dbe3ee"/>
    <text x="82" y="920" font-size="20" font-weight="700" fill="#0f172a">Interpretation discipline</text>
    <text x="82" y="955" font-size="18" fill="#475569">These equations identify the mathematical object of each bench; they do not replace preregistration, controls,</text>
    <text x="82" y="982" font-size="18" fill="#475569">evidence gates, numerical policies or the canonical programme documents.</text>
  </g>
</svg>