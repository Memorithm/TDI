<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">TDI research programme roadmap through TDI-23</title>
  <desc id="desc">Dynamic Information Theory research programme from completed finite-state evidence through active successor, causal representation, Boolean relational, frozen torsor-contract, bounded TDI-22.2, and categorical dagger research lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10263f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6be"/>
      <stop offset="1" stop-color="#7aa7ff"/>
    </linearGradient>
    <style>
      .title { font: 700 54px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 23px system-ui, -apple-system, Segoe UI, sans-serif; fill: #bad0e5; }
      .small { font: 600 17px system-ui, -apple-system, Segoe UI, sans-serif; fill: #8faec7; letter-spacing: 1.35px; }
      .stage { font: 700 23px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f5f9fd; }
      .status { font: 700 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #63e5c6; }
      .done { font: 700 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #a8bfd2; }
      .desc { font: 400 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #bad0e5; }
    </style>
  </defs>

  <rect width="1600" height="820" rx="28" fill="url(#bg)"/>
  <rect x="54" y="48" width="1492" height="6" rx="3" fill="url(#accent)"/>

  <text x="72" y="120" class="small">TDI · DYNAMIC INFORMATION THEORY · RESEARCH MAP 1 → 23.x</text>
  <text x="72" y="188" class="title">Controlled research on predictive dynamics</text>
  <text x="72" y="230" class="subtitle">Preregistration · deterministic evaluators · fail-closed gates · reproducible evidence · explicit negative results</text>

  <g transform="translate(72 288)">
    <rect width="456" height="158" rx="20" fill="#132b44" stroke="#274761"/>
    <text x="24" y="40" class="stage">TDI-1 → TDI-6.x</text>
    <text x="24" y="70" class="done">COMPLETED / PREREGISTERED EVIDENCE BASE</text>
    <text x="24" y="101" class="desc">Finite-state dynamics, branching, exact batteries,</text>
    <text x="24" y="124" class="desc">non-exact controls and transport/order questions.</text>
  </g>

  <g transform="translate(572 288)">
    <rect width="456" height="158" rx="20" fill="#132b44" stroke="#274761"/>
    <text x="24" y="40" class="stage">TDI-7.x → TDI-12.x</text>
    <text x="24" y="70" class="status">ACTIVE SUCCESSOR PROGRAMMES</text>
    <text x="24" y="101" class="desc">Attention/memory, recurrent association, adaptive</text>
    <text x="24" y="124" class="desc">inference, operators and hallucination dynamics.</text>
  </g>

  <g transform="translate(1072 288)">
    <rect width="456" height="158" rx="20" fill="#132b44" stroke="#274761"/>
    <text x="24" y="40" class="stage">TDI-13.x → TDI-20.x</text>
    <text x="24" y="70" class="status">ACTIVE STAGE-0 CONJECTURE FRONTIER</text>
    <text x="24" y="101" class="desc">Causal dimensionality, predictive geometry, event</text>
    <text x="24" y="124" class="desc">triggers, verification and autonomous discovery.</text>
  </g>

  <g transform="translate(72 484)">
    <rect width="456" height="158" rx="20" fill="#0e3540" stroke="#55d6be" stroke-width="2"/>
    <text x="24" y="40" class="stage">TDI-21.x</text>
    <text x="24" y="70" class="status">BOOLEAN RELATIONAL ARCHITECTURE</text>
    <text x="24" y="101" class="desc">Attention-like functionality without attention scoring;</text>
    <text x="24" y="124" class="desc">Boolean / F2 / ANF routing and bounded memory.</text>
  </g>

  <g transform="translate(572 484)">
    <rect width="456" height="158" rx="20" fill="#0e3540" stroke="#55d6be" stroke-width="2"/>
    <text x="24" y="40" class="stage">TDI-22.x</text>
    <text x="24" y="70" class="status">22.0/22.1 FROZEN · 22.2 BOUNDED ACTIVE</text>
    <text x="24" y="101" class="desc">Frozen torsor/matched-control contracts; deterministic</text>
    <text x="24" y="124" class="desc">evaluator + P1–P5 generator, no campaign result.</text>
  </g>

  <g transform="translate(1072 484)">
    <rect width="456" height="158" rx="20" fill="#0e3540" stroke="#7aa7ff" stroke-width="2"/>
    <text x="24" y="40" class="stage">TDI-23.x</text>
    <text x="24" y="70" class="status">CATEGORICAL / DAGGER ATTENTION</text>
    <text x="24" y="101" class="desc">Typed IR, dagger semantics, reduction diagnostics,</text>
    <text x="24" y="124" class="desc">rooted provenance and exact equivalence tooling.</text>
  </g>

  <g transform="translate(72 678)">
    <rect width="1456" height="76" rx="18" fill="#0b1f33" stroke="#274761"/>
    <text x="24" y="30" class="small">SCIENTIFIC STATUS RULE</text>
    <text x="24" y="55" class="desc">Frozen non-final contract ≠ confirmatory result. Final execution and downstream product claims require their own explicit gates.</text>
  </g>

  <text x="72" y="793" class="small">EVIDENCE FIRST · CLAIMS BOUNDED BY FROZEN EXPERIMENTS</text>
</svg>