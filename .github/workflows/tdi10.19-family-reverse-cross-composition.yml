name: TDI-10.19 Family reverse/cross composition

on:
  pull_request:
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_family_reverse_cross_composition.rs"
      - "docs/tdi10/TDI-10.19-FAMILY-REVERSE-CROSS-COMPOSITION.md"
      - "scripts/check-tdi10.19-family-reverse-cross-composition.sh"
      - ".github/workflows/tdi10.19-family-reverse-cross-composition.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_family_reverse_cross_composition.rs"
      - "docs/tdi10/TDI-10.19-FAMILY-REVERSE-CROSS-COMPOSITION.md"
      - "scripts/check-tdi10.19-family-reverse-cross-composition.sh"
      - ".github/workflows/tdi10.19-family-reverse-cross-composition.yml"

permissions:
  contents: read

jobs:
  family-reverse-cross-composition:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.19 reverse/cross family composition
        run: bash scripts/check-tdi10.19-family-reverse-cross-composition.sh
