name: TDI research consultation and reporting
on:
  pull_request:
    paths: ['scripts/tdi_*', 'scripts/test_tdi_*', 'scripts/requirements-reporting.txt', 'scripts/fixtures/tdi-catalogue-*.sql', 'tdi-bench/**', 'tdi-core/**', 'tdi-ai/**', 'Cargo.*', 'docs/engineering/**', '.github/workflows/tdi-research-reporting.yml']
  push:
    branches: [main]
    paths: ['scripts/tdi_*', 'scripts/test_tdi_*', 'scripts/requirements-reporting.txt', 'scripts/fixtures/tdi-catalogue-*.sql', 'tdi-bench/**', 'tdi-core/**', 'tdi-ai/**', 'Cargo.*', 'docs/engineering/**', '.github/workflows/tdi-research-reporting.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tdi-research-reporting-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reporting:
    strategy:
      fail-fast: false
      matrix:
        figures: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: '-C debuginfo=0'
      PYTHONDONTWRITEBYTECODE: '1'
      TDI_REPORT_FIGURES: ${{ matrix.figures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: integration-tdi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Memorithm/Forge
          ref: 0d48a91a5eed6a9ae09a5eacd7c4f18df8bdd333
          persist-credentials: false
          path: integration-forge
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Memorithm/scirust-hub
          ref: ccdcb99a4573dbefb944af0df713101b100b5f78
          persist-credentials: false
          path: integration-hub
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Memorithm/scirust
          ref: 06c9eaef248c0f40b7d363c16a7b4c1c1c54a5a0
          persist-credentials: false
          path: integration-scirust
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.89.0
      - run: cargo build --locked -p forge-bridge --example scientific_search
        working-directory: integration-forge
      - run: cargo build --locked -p scirust-hubd -p scirust-hub-worker
        working-directory: integration-hub
      - run: cargo build --locked -p tdi-bench --example finite_search_worker
        working-directory: integration-tdi
      - run: cargo build --locked -p tdi-ai --example durable_worker
        working-directory: integration-tdi
      - run: cargo build --locked -p scirust-stats --example research_stats
        working-directory: integration-scirust
      - name: Install isolated minimal or optional reporting profile
        working-directory: integration-tdi
        run: |
          python3 -m venv .venv-report
          if test "$TDI_REPORT_FIGURES" = 1; then
            .venv-report/bin/python -m pip install -r scripts/requirements-reporting.txt
          fi
      - name: Qualify actual reports, catalogue and search consultation
        working-directory: integration-tdi
        env:
          PYTHONPATH: scripts
          TDI_HUBD_BIN: ${{ github.workspace }}/integration-hub/target/debug/scirust-hubd
          TDI_DURABLE_WORKER: ${{ github.workspace }}/integration-tdi/target/debug/examples/durable_worker
          TDI_SCIRUST_STATS_BIN: ${{ github.workspace }}/integration-scirust/target/debug/examples/research_stats
          TDI_SCIRUST_SOURCE_COMMIT: 06c9eaef248c0f40b7d363c16a7b4c1c1c54a5a0
          TDI_SEARCH_WORKER: ${{ github.workspace }}/integration-tdi/target/debug/examples/finite_search_worker
          TDI_FORGE_WORKER: ${{ github.workspace }}/integration-forge/target/debug/examples/scientific_search
          TDI_FORGE_SOURCE_COMMIT: 0d48a91a5eed6a9ae09a5eacd7c4f18df8bdd333
          TDI_SEARCH_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .venv-report/bin/python -m unittest -v scripts/test_tdi_research_reporting.py scripts.test_tdi_forge_integration.SearchIntegrationTests.test_actual_search_restart_incorrect_excluded_and_no_repeat_measurement scripts/test_tdi_engine_unit.py scripts/test_tdi_engine_integration.py
