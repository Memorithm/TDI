name: TDI-7.4 bounded Gaussian MMI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tdi74-bounded-${{ github.ref }}
  cancel-in-progress: true

env:
  TDI_CI_RUST: "1.97.1"

jobs:
  bounded-information:
    name: TDI-7.4 bounded Gaussian MMI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: rustfmt,clippy
      - name: Check TDI-7.4 source formatting
        run: |
          rustfmt --edition 2024 --check \
            tdi-bench/src/lib.rs \
            tdi-bench/src/attention_v7.rs \
            tdi-bench/src/predictive_v7.rs \
            tdi-bench/src/gaussian_mmi_v7_stable.rs \
            tdi-bench/src/bin/tdi-attention-v74.rs
      - name: Check TDI-7.4 with Clippy
        run: >-
          cargo clippy -p tdi-bench --lib
          --bin tdi-attention-v74
          --locked -- -D warnings
      - name: Run TDI-7.4 bounded tests
        run: >-
          cargo test -p tdi-bench --lib
          --bin tdi-attention-v74
          --locked
      - name: Execute bounded TDI-7.4 evaluator
        shell: bash
        run: |
          output="$(cargo run -q -p tdi-bench --bin tdi-attention-v74 --locked)"
          printf '%s\n' "$output"
          grep -Fx 'scope=development+validation' <<<"$output"
          grep -Fx 'source_static=exactly_six_TDI7.1_static_controls' <<<"$output"
          grep -Fx 'source_recovery=depths_1_2_3_4' <<<"$output"
          grep -Fx 'target=bounded_retrieval_deficit_depth_5' <<<"$output"
          grep -Fx 'estimator=gaussian_mmi_vector_v1' <<<"$output"
          grep -Fx 'rank_reduction=declared_order_modified_gram_schmidt_v1' <<<"$output"
          grep -Fx 'bootstrap=generator_grouped_percentile_95' <<<"$output"
          grep -Fx 'final_holdout=NOT_ACCESSED' <<<"$output"
          grep -Fx 'confirmatory_H_AI_3_verdict=NOT_COMPUTED' <<<"$output"
          test "$(grep -c '^tdi74-gaussian-mmi-v1;' <<<"$output")" -eq 4
      - name: Prove final-run authorization is absent
        shell: bash
        run: |
          ! grep -R -F 'I_ACCEPT_THE_TDI7_HOLDOUT_FREEZE' \
            tdi-bench/src/lib.rs \
            tdi-bench/src/gaussian_mmi_v7_stable.rs \
            tdi-bench/src/bin/tdi-attention-v74.rs
          ! grep -R -F 'TDI7_CONFIRM_FINAL_HOLDOUT' \
            tdi-bench/src/lib.rs \
            tdi-bench/src/gaussian_mmi_v7_stable.rs \
            tdi-bench/src/bin/tdi-attention-v74.rs
