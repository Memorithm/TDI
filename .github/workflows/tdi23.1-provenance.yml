name: TDI-23.1 rooted IR provenance

on:
  pull_request:
    paths-ignore:
      - 'docs/engineering/**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tdi23-1-provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rooted-ir-provenance:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tdi' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify TDI-23.1 rooted IR provenance
        run: bash scripts/check-tdi23.1-provenance.sh
