name: TDI-7 pre-arm integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tdi7-prearm-${{ github.ref }}
  cancel-in-progress: true

env:
  TDI_CI_RUST: "1.97.1"

jobs:
  prearm-integrity:
    # Historical context name kept stable for branch-protection compatibility.
    name: TDI-7 pre-arm fail-closed audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TDI_CI_RUST }}

      - name: Validate TDI-7 integrity script syntax
        run: |
          bash -n scripts/check-tdi7-prearm-integrity.sh
          bash -n scripts/check-tdi7.2-unarmed.sh

      - name: Prove frozen post-holdout state and closed rerun surface
        run: |
          env -u TDI7_CONFIRM_FINAL_HOLDOUT \
            bash scripts/check-tdi7-prearm-integrity.sh >/tmp/tdi7-integrity.log 2>&1
          grep -F "TDI-7.2 pre-holdout decisions: FROZEN (historical inputs preserved)" /tmp/tdi7-integrity.log
          grep -F "TDI-7.2 frozen result record: PRESENT (payload not inspected)" /tmp/tdi7-integrity.log
          grep -F "TDI-7.2 final-holdout runner: RETIRED / RERUN SURFACE CLOSED" /tmp/tdi7-integrity.log
          grep -F "TDI-7 post-holdout integrity gate: PASS" /tmp/tdi7-integrity.log
          test ! -e tdi-ai/examples/tdi7_final_holdout.rs

      - name: Prove authorization environment stays rejected
        run: |
          set +e
          TDI7_CONFIRM_FINAL_HOLDOUT=ci-refusal-probe \
            bash scripts/check-tdi7-prearm-integrity.sh >/tmp/tdi7-auth.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "refuses any final-holdout authorization variable" /tmp/tdi7-auth.log
