name: TDI Optuna comparison
on:
  pull_request:
    paths: ['scripts/tdi_*.py', 'scripts/test_tdi_optuna_benchmark.py', 'scripts/requirements-optuna-benchmark.txt', 'docs/engineering/optuna-comparison.md', '.github/workflows/tdi-optuna-comparison.yml']
  push:
    branches: [main]
    paths: ['scripts/tdi_*.py', 'scripts/test_tdi_optuna_benchmark.py', 'scripts/requirements-optuna-benchmark.txt', 'docs/engineering/optuna-comparison.md', '.github/workflows/tdi-optuna-comparison.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tdi-optuna-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: '-C debuginfo=0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: integration-tdi
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Memorithm/Forge
          ref: 28067ab0aa1d52a2260d9bb2bf35a346547a292a
          path: integration-forge
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - run: cargo build --release --locked -p forge-bridge --example scientific_search
        working-directory: integration-forge
      - name: Install the isolated Optuna comparison profile
        working-directory: integration-tdi
        run: |
          python3 -m venv .venv-optuna
          .venv-optuna/bin/python -m pip install -r scripts/requirements-optuna-benchmark.txt
          .venv-optuna/bin/python -m pip check
      - name: Check fairness, oracle and evidence rejection
        working-directory: integration-tdi
        run: PYTHONPATH=scripts .venv-optuna/bin/python -m unittest -v scripts/test_tdi_optuna_benchmark.py
      - name: Run actual Forge and Optuna smoke comparison
        working-directory: integration-tdi
        run: |
          .venv-optuna/bin/python scripts/tdi_optuna_benchmark.py \
            --forge-worker ../integration-forge/target/release/examples/scientific_search \
            --profile smoke --max-seconds 300 --output optuna-comparison
          .venv-optuna/bin/python scripts/tdi_optuna_benchmark.py \
            --verify-report optuna-comparison/report.json
      - name: Retain raw successful or partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tdi-optuna-comparison
          path: integration-tdi/optuna-comparison
          if-no-files-found: warn
          retention-days: 14
