name: TDI-24.0 slice 15 difficulty strata
on:
  pull_request:
    paths:
      - 'tdi-ai/src/tdi24_tasks.rs'
      - 'docs/TDI-24-CAMPAIGN-50.md'
      - 'scripts/check-tdi24-s15.sh'
      - '.github/workflows/tdi24-s15-difficulty-strata.yml'
permissions:
  contents: read
jobs:
  difficulty-strata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: bash scripts/check-tdi24-s15.sh
