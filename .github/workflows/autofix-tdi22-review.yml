name: One-shot TDI-22.2 review autofix

on:
  push:
    branches:
      - research/tdi-22.2-evaluator-foundation-v2
    paths:
      - '.github/workflows/autofix-tdi22-review.yml'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: research/tdi-22.2-evaluator-foundation-v2
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply P1 review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tdi-ai/src/tdi22_eval.rs')
          text = path.read_text()

          old_import = 'use super::tdi22_torsor::{Torsor3, TorsorError, Twist3, Vec3};'
          new_import = '''use super::tdi22_torsor::{
              FactorizedTorsorKey, FactorizedTwistQuery, Torsor3, TorsorError, Twist3, Vec3,
          };'''
          if old_import not in text:
              raise SystemExit('expected tdi22_torsor import not found')
          text = text.replace(old_import, new_import, 1)

          old_score = '''pub fn score(arm: Arm, query: EvalQuery, key: EvalKey) -> Result<f64, EvalError> {
              let linear = query.twist.linear();
              let angular = query.twist.angular();
              let resultant = key.torsor.resultant();

              let value = match arm {
                  Arm::T0 | Arm::T1 => linear.dot(resultant) + angular.dot(key.torsor.moment()),
                  Arm::T4 => linear.dot(resultant) + angular.dot(key.origin_moment),
                  Arm::T3 => {
                      let factorized = query
                          .twist
                          .factorized_at(query.position)
                          .map_err(EvalError::Algebra)?;
                      bound_vec(
                          factorized.resultant_dual,
                          "factorized_resultant_dual",
                          MAX_COMPONENT_ABS,
                      )?;
                      bound_vec(
                          factorized.moment_dual,
                          "factorized_moment_dual",
                          MAX_COMPONENT_ABS,
                      )?;
                      factorized
                          .pair(key.torsor.factorized_key().map_err(EvalError::Algebra)?)
                          .map_err(EvalError::Algebra)?
                  }
              };

              if value.is_finite() {
                  Ok(value)
              } else {
                  Err(EvalError::NonFiniteScore)
              }
          }
          '''
          new_score = '''fn factorized_t3_query(query: EvalQuery) -> Result<FactorizedTwistQuery, EvalError> {
              let factorized = query
                  .twist
                  .factorized_at(query.position)
                  .map_err(EvalError::Algebra)?;
              bound_vec(
                  factorized.resultant_dual,
                  "factorized_resultant_dual",
                  MAX_COMPONENT_ABS,
              )?;
              bound_vec(
                  factorized.moment_dual,
                  "factorized_moment_dual",
                  MAX_COMPONENT_ABS,
              )?;
              Ok(factorized)
          }

          fn score_t3_factorized(
              factorized: FactorizedTwistQuery,
              key: EvalKey,
          ) -> Result<f64, EvalError> {
              factorized
                  .pair(FactorizedTorsorKey {
                      resultant: key.torsor.resultant(),
                      origin_moment: key.origin_moment,
                  })
                  .map_err(EvalError::Algebra)
          }

          pub fn score(arm: Arm, query: EvalQuery, key: EvalKey) -> Result<f64, EvalError> {
              let linear = query.twist.linear();
              let angular = query.twist.angular();
              let resultant = key.torsor.resultant();

              let value = match arm {
                  Arm::T0 | Arm::T1 => linear.dot(resultant) + angular.dot(key.torsor.moment()),
                  Arm::T4 => linear.dot(resultant) + angular.dot(key.origin_moment),
                  Arm::T3 => score_t3_factorized(factorized_t3_query(query)?, key)?,
              };

              if value.is_finite() {
                  Ok(value)
              } else {
                  Err(EvalError::NonFiniteScore)
              }
          }
          '''
          if old_score not in text:
              raise SystemExit('expected score implementation not found')
          text = text.replace(old_score, new_score, 1)

          old_rank = '''    let mut scored = Vec::with_capacity(candidates.len());
              for candidate in candidates {
                  scored.push((candidate.identity, score(arm, query, *candidate)?));
              }
              scored.sort_by(|lhs, rhs| rhs.1.total_cmp(&lhs.1));

              if scores_tied(scored[0].1, scored[1].1) {
                  return Err(if arm == Arm::T1 {
                      EvalError::AmbiguousT1Top
                  } else {
                      EvalError::AmbiguousTarget
                  });
              }
          '''
          new_rank = '''    let factorized_t3 = if arm == Arm::T3 {
                  Some(factorized_t3_query(query)?)
              } else {
                  None
              };

              let mut scored = Vec::with_capacity(candidates.len());
              for candidate in candidates {
                  let candidate_score = if let Some(factorized) = factorized_t3 {
                      score_t3_factorized(factorized, *candidate)?
                  } else {
                      score(arm, query, *candidate)?
                  };
                  scored.push((candidate.identity, candidate_score));
              }
              scored.sort_by(|lhs, rhs| rhs.1.total_cmp(&lhs.1));

              if arm == Arm::T1 && scores_tied(scored[0].1, scored[1].1) {
                  return Err(EvalError::AmbiguousT1Top);
              }
          '''
          if old_rank not in text:
              raise SystemExit('expected ranking implementation not found')
          text = text.replace(old_rank, new_rank, 1)

          anchor = '''    #[test]
              fn resource_ledger_exposes_all_frozen_fields() {
          '''
          regression = '''    #[test]
              fn non_t1_top_ties_remain_admissible() {
                  let query = query(Vec3::zero());
                  let mut candidates = Vec::new();
                  for identity in 0..CANDIDATES_PER_QUERY {
                      candidates.push(key(identity as u16, 1.0, Vec3::zero()));
                  }

                  for arm in [Arm::T0, Arm::T3, Arm::T4] {
                      assert!(rank_candidates(arm, query, &candidates).is_ok());
                  }
              }

          '''
          if anchor not in text:
              raise SystemExit('resource ledger test anchor not found')
          text = text.replace(anchor, regression + anchor, 1)

          path.write_text(text)
          PY

          cargo fmt --all
          bash scripts/check-tdi22.2-foundation.sh

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'ZEKRITI TAREK'
          git config user.email 'contact@checkupauto.fr'
          git rm .github/workflows/autofix-tdi22-review.yml
          git add tdi-ai/src/tdi22_eval.rs
          git commit -m 'fix(tdi22): align ranking work with frozen ledger'
          git push origin HEAD:research/tdi-22.2-evaluator-foundation-v2
