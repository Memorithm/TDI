name: Fix TDI-22 invariant overflow once

on:
  push:
    branches: [research/tdi-22-torsor-attention]
    paths: [.github/workflows/fix-tdi22-invariants-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tdi-22-torsor-attention
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Apply finite-overflow correction
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_tdi22_invariants_once.py
          cargo fmt -p tdi-ai -- --check
          cargo clippy -p tdi-ai --features experimental --all-targets -- -D warnings
          cargo test -p tdi-ai --features experimental tdi22_torsor
          git diff --exit-code -- Cargo.lock
      - name: Commit source-only correction and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git rm .github/workflows/fix-tdi22-invariants-once.yml .github/scripts/fix_tdi22_invariants_once.py
          git add tdi-ai/src/tdi22_torsor.rs
          git diff --cached --quiet && exit 1
          git commit -m 'fix(tdi22): reject non-finite derived invariants'
          git push origin HEAD:research/tdi-22-torsor-attention
