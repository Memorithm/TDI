name: TDI-25.0 slice 02 source-contract provenance pin

on:
  pull_request:
    paths:
      - 'tdi-ai/src/tdi25_torsor_chiral.rs'
      - 'docs/TDI-25-CAMPAIGN-50.md'
      - 'docs/TDI-25-SOURCE-CONTRACTS.md'
      - 'scripts/check-tdi25-s02.sh'
      - '.github/workflows/tdi25-s02-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'tdi-ai/src/tdi25_torsor_chiral.rs'
      - 'docs/TDI-25-CAMPAIGN-50.md'
      - 'docs/TDI-25-SOURCE-CONTRACTS.md'
      - 'scripts/check-tdi25-s02.sh'
      - '.github/workflows/tdi25-s02-provenance.yml'

permissions:
  contents: read

concurrency:
  group: tdi25-s02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Qualify TDI-25 slice 02
        run: bash scripts/check-tdi25-s02.sh
