name: TDI-25 Stage-0 torsor vs chiral bootstrap

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tdi25-stage0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage0-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Qualify bounded TDI-25 Stage-0 contract
        run: |
          cargo fmt --all -- --check
          cargo clippy -p tdi-ai --features experimental --all-targets -- -D warnings
          cargo test -p tdi-ai --features experimental tdi25
          grep -Fq 'T6 vs C6 remains the primary contrast.' docs/TDI-25-PROGRAMME.md
          grep -Fq 'No premature hybrid' docs/TDI-25-PROGRAMME.md
          grep -Fq '50 substantive PR slices' docs/TDI-25-PROGRAMME.md
