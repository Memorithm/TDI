name: TDI-22.1A T1 value reconstruction

on:
  pull_request:
    paths:
      - 'docs/TDI-22.1A-T1-VALUE-METRIC-AMENDMENT.md'
      - 'scripts/check-tdi22.1a-t1-value.sh'
      - '.github/workflows/tdi22.1a-t1-value.yml'
      - 'tdi-ai/src/tdi22_runner.rs'
      - 'results/**'
      - 'artifacts/**'
  push:
    branches:
      - main
    paths:
      - 'docs/TDI-22.1A-T1-VALUE-METRIC-AMENDMENT.md'
      - 'scripts/check-tdi22.1a-t1-value.sh'
      - '.github/workflows/tdi22.1a-t1-value.yml'
      - 'tdi-ai/src/tdi22_runner.rs'
      - 'results/**'
      - 'artifacts/**'

permissions:
  contents: read

jobs:
  amendment-integrity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check TDI-22.1A amendment
        run: bash scripts/check-tdi22.1a-t1-value.sh
