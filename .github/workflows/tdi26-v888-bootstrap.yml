name: TDI-26 BANC v888 Stage-0 bootstrap

on:
  pull_request:
    paths:
      - 'tdi-ai/src/experimental.rs'
      - 'tdi-ai/src/tdi26_v888.rs'
      - 'docs/TDI-26-PROGRAMME.md'
      - 'docs/TDI-26.0-SCOPE.md'
      - 'docs/TDI-26.0-STATUS.md'
      - 'docs/TDI-26.0-IMPLEMENTATION-GATE.md'
      - 'scripts/check-tdi26-bootstrap.sh'
      - '.github/workflows/tdi26-v888-bootstrap.yml'
  push:
    branches:
      - main
    paths:
      - 'tdi-ai/src/experimental.rs'
      - 'tdi-ai/src/tdi26_v888.rs'
      - 'docs/TDI-26-PROGRAMME.md'
      - 'docs/TDI-26.0-SCOPE.md'
      - 'docs/TDI-26.0-STATUS.md'
      - 'docs/TDI-26.0-IMPLEMENTATION-GATE.md'
      - 'scripts/check-tdi26-bootstrap.sh'
      - '.github/workflows/tdi26-v888-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: tdi26-v888-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage0-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Qualify TDI-26 Stage-0 contract
        run: |
          cargo fmt --all -- --check
          cargo clippy -p tdi-ai --features experimental --all-targets -- -D warnings
          bash scripts/check-tdi26-bootstrap.sh
