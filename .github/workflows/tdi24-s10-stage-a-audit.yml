name: TDI-24.0 slice 10 Stage-A audit
on:
  pull_request:
    paths:
      - 'tdi-ai/src/tdi24_accounting.rs'
      - 'tdi-ai/src/tdi24_attention.rs'
      - 'tdi-ai/src/tdi24_chiral.rs'
      - 'tdi-ai/src/tdi24_vector.rs'
      - 'tdi-ai/tests/tdi24_stage_a_audit.rs'
      - 'docs/TDI-24-CAMPAIGN-50.md'
      - 'docs/TDI-24-STAGE-A-AUDIT.md'
      - 'docs/tdi24-stage-a-freeze.yaml'
      - 'scripts/check-tdi24-s10.sh'
      - '.github/workflows/tdi24-s10-stage-a-audit.yml'
permissions:
  contents: read
jobs:
  stage-a-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: bash scripts/check-tdi24-s10.sh
