name: TDI-11.4 uncertainty preregistration

on:
  pull_request:
    paths:
      - 'docs/tdi11.4-uncertainty-stratified-preregistration.json'
      - 'scripts/validate_tdi11_4_uncertainty_prereg.py'
      - '.github/workflows/tdi11-4-uncertainty-prereg.yml'
  push:
    branches: [main]
    paths:
      - 'docs/tdi11.4-uncertainty-stratified-preregistration.json'
      - 'scripts/validate_tdi11_4_uncertainty_prereg.py'
      - '.github/workflows/tdi11-4-uncertainty-prereg.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate fail-closed preregistration
        run: python scripts/validate_tdi11_4_uncertainty_prereg.py
