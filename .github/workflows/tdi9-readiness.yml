name: TDI-9.1 readiness integrity

on:
  pull_request:
    paths-ignore:
      - 'docs/engineering/**'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tdi' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify TDI-9.1 readiness integrity
        run: bash scripts/check-tdi9.1-readiness.sh
