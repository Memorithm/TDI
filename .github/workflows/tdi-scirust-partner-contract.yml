name: TDI SciRust partner contracts

on:
  pull_request:
    paths:
      - 'scripts/tdi_scirust_partner_contract.py'
      - 'scripts/test_tdi_scirust_partner_contract.py'
      - 'scripts/tdi_partner_adapter_contract.py'
      - 'scripts/test_tdi_partner_adapter_contract.py'
      - 'scripts/tdi_hub_admission_contract.py'
      - 'scripts/test_tdi_hub_admission_contract.py'
      - 'scripts/tdi_hub_edge_contract.py'
      - 'scripts/tdi_execution_graph.py'
      - 'scripts/tdi_artifact_contract.py'
      - 'scripts/tdi_experiment_contract.py'
      - 'docs/engineering/industrialization-status.md'
      - 'docs/engineering/lot-h-scirust-primitive-boundary.md'
      - '.github/workflows/tdi-scirust-partner-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/tdi_scirust_partner_contract.py'
      - 'scripts/test_tdi_scirust_partner_contract.py'
      - 'scripts/tdi_partner_adapter_contract.py'
      - 'scripts/test_tdi_partner_adapter_contract.py'
      - 'scripts/tdi_hub_admission_contract.py'
      - 'scripts/test_tdi_hub_admission_contract.py'
      - 'scripts/tdi_hub_edge_contract.py'
      - 'scripts/tdi_execution_graph.py'
      - 'scripts/tdi_artifact_contract.py'
      - 'scripts/tdi_experiment_contract.py'
      - 'docs/engineering/industrialization-status.md'
      - 'docs/engineering/lot-h-scirust-primitive-boundary.md'
      - '.github/workflows/tdi-scirust-partner-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tdi' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile TDI SciRust adapter contracts
        run: |
          PYTHONPATH=scripts python3 -m py_compile \
            scripts/tdi_experiment_contract.py \
            scripts/tdi_artifact_contract.py \
            scripts/tdi_execution_graph.py \
            scripts/tdi_hub_edge_contract.py \
            scripts/tdi_hub_admission_contract.py \
            scripts/tdi_partner_adapter_contract.py \
            scripts/tdi_scirust_partner_contract.py \
            scripts/test_tdi_hub_admission_contract.py \
            scripts/test_tdi_partner_adapter_contract.py \
            scripts/test_tdi_scirust_partner_contract.py
      - name: Run TDI SciRust adapter regressions
        run: |
          PYTHONPATH=scripts python3 -m unittest \
            scripts/test_tdi_hub_admission_contract.py \
            scripts/test_tdi_partner_adapter_contract.py \
            scripts/test_tdi_scirust_partner_contract.py -v
