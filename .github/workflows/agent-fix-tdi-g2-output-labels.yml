name: Agent fix TDI G2 output labels

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'industrialize/hub-authoritative-publication-g2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: industrialize/hub-authoritative-publication-g2
          fetch-depth: 0
      - name: Apply review fix
        run: python3 .agent/fix_tdi_g2_output_labels.py
      - name: Compile contracts
        run: |
          PYTHONPATH=scripts python3 -m py_compile \
            scripts/tdi_experiment_contract.py \
            scripts/tdi_artifact_contract.py \
            scripts/tdi_hub_edge_contract.py \
            scripts/test_tdi_hub_edge_contract.py
      - name: Run Hub edge contract regressions
        run: PYTHONPATH=scripts python3 -m unittest scripts/test_tdi_hub_edge_contract.py -v
      - name: Commit review correction when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/tdi_hub_edge_contract.py scripts/test_tdi_hub_edge_contract.py; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name "ZEKRITI TAREK"
          git config user.email "contact@checkupauto.fr"
          git add scripts/tdi_hub_edge_contract.py scripts/test_tdi_hub_edge_contract.py
          git commit -m "fix(engine): accept Hub output-label grammar"
          git push origin HEAD:industrialize/hub-authoritative-publication-g2
