name: TDI-11.2 model observation freeze

on:
  pull_request:
    paths-ignore:
      - 'docs/engineering/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  model-observation-freeze:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tdi' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate non-executing TDI-11.2 freeze
        run: python3 scripts/check-tdi11.2-model-observation-freeze.py

      - name: Test immutable pin provenance contract
        run: python3 scripts/test-tdi11.2-model-observation-freeze.py

      - name: Fail-closed TDI-11.2 readiness tests
        run: python3 scripts/test-tdi11.2-readiness.py

