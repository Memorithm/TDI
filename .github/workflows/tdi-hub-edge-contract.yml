name: TDI Hub edge contracts

on:
  pull_request:
    paths:
      - 'scripts/tdi_hub_edge_contract.py'
      - 'scripts/test_tdi_hub_edge_contract.py'
      - 'scripts/tdi_hub_admission_contract.py'
      - 'scripts/test_tdi_hub_admission_contract.py'
      - 'scripts/tdi_execution_graph.py'
      - 'scripts/tdi_artifact_contract.py'
      - 'scripts/tdi_experiment_contract.py'
      - 'docs/engineering/industrialization-status.md'
      - '.github/workflows/tdi-hub-edge-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/tdi_hub_edge_contract.py'
      - 'scripts/test_tdi_hub_edge_contract.py'
      - 'scripts/tdi_hub_admission_contract.py'
      - 'scripts/test_tdi_hub_admission_contract.py'
      - 'scripts/tdi_execution_graph.py'
      - 'scripts/tdi_artifact_contract.py'
      - 'scripts/tdi_experiment_contract.py'
      - 'docs/engineering/industrialization-status.md'
      - '.github/workflows/tdi-hub-edge-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ${{ vars.TDI_LOCAL_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tdi' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile Hub edge and artifact contracts
        run: |
          PYTHONPATH=scripts python3 -m py_compile \
            scripts/tdi_experiment_contract.py \
            scripts/tdi_artifact_contract.py \
            scripts/tdi_execution_graph.py \
            scripts/tdi_hub_edge_contract.py \
            scripts/tdi_hub_admission_contract.py \
            scripts/test_tdi_artifact_contract.py \
            scripts/test_tdi_hub_edge_contract.py \
            scripts/test_tdi_hub_admission_contract.py
      - name: Run Hub edge and artifact contract regressions
        run: |
          PYTHONPATH=scripts python3 -m unittest \
            scripts/test_tdi_artifact_contract.py \
            scripts/test_tdi_hub_edge_contract.py \
            scripts/test_tdi_hub_admission_contract.py -v
