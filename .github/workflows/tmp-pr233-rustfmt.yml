name: Temporary PR233 rustfmt cleanup

on:
  push:
    branches:
      - research/tdi-21-boolean-relational-architecture

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/tdi-21-boolean-relational-architecture
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Format and validate Rust
        run: |
          cargo fmt --all
          rm .github/workflows/tmp-pr233-rustfmt.yml
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit cleanup
        run: |
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add -A
          git commit -m "style(tdi-21): satisfy rustfmt gate"
          git push origin HEAD:research/tdi-21-boolean-relational-architecture
