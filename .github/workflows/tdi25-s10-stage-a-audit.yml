name: TDI-25.0 slice 10 Stage-A audit
on:
  pull_request:
    paths:
      - 'tdi-ai/src/tdi25_torsor_chiral.rs'
      - 'tdi-ai/tests/tdi25_stage_a_audit.rs'
      - 'docs/TDI-25-CAMPAIGN-50.md'
      - 'docs/TDI-25-STAGE-A-AUDIT.md'
      - 'docs/tdi25-stage-a-freeze.yaml'
      - 'scripts/check-tdi25-s10.sh'
      - '.github/workflows/tdi25-s10-stage-a-audit.yml'
permissions:
  contents: read
jobs:
  stage-a-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: bash scripts/check-tdi25-s10.sh
