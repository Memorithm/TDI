name: TDI partner adapter contracts

on:
  pull_request:
    paths:
      - 'scripts/tdi_partner_adapter_contract.py'
      - 'scripts/test_tdi_partner_adapter_contract.py'
      - 'scripts/tdi_hub_admission_contract.py'
      - 'scripts/test_tdi_hub_admission_contract.py'
      - 'scripts/tdi_hub_edge_contract.py'
      - 'scripts/tdi_execution_graph.py'
      - 'scripts/tdi_artifact_contract.py'
      - 'scripts/tdi_experiment_contract.py'
      - 'docs/engineering/industrialization-status.md'
      - '.github/workflows/tdi-partner-adapter-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/tdi_partner_adapter_contract.py'
      - 'scripts/test_tdi_partner_adapter_contract.py'
      - 'scripts/tdi_hub_admission_contract.py'
      - 'scripts/test_tdi_hub_admission_contract.py'
      - 'scripts/tdi_hub_edge_contract.py'
      - 'scripts/tdi_execution_graph.py'
      - 'scripts/tdi_artifact_contract.py'
      - 'scripts/tdi_experiment_contract.py'
      - 'docs/engineering/industrialization-status.md'
      - '.github/workflows/tdi-partner-adapter-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile partner adapter contracts
        run: |
          PYTHONPATH=scripts python3 -m py_compile \
            scripts/tdi_experiment_contract.py \
            scripts/tdi_artifact_contract.py \
            scripts/tdi_execution_graph.py \
            scripts/tdi_hub_edge_contract.py \
            scripts/tdi_hub_admission_contract.py \
            scripts/tdi_partner_adapter_contract.py \
            scripts/test_tdi_hub_admission_contract.py \
            scripts/test_tdi_partner_adapter_contract.py
      - name: Run partner adapter contract regressions
        run: |
          PYTHONPATH=scripts python3 -m unittest \
            scripts/test_tdi_hub_admission_contract.py \
            scripts/test_tdi_partner_adapter_contract.py -v
