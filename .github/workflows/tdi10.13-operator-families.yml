name: TDI-10.13 Operator family witnesses

on:
  pull_request:
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_operator_families.rs"
      - "docs/tdi10/TDI-10.13-OPERATOR-FAMILY-WITNESSES.md"
      - "scripts/check-tdi10.13-operator-families.sh"
      - ".github/workflows/tdi10.13-operator-families.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_operator_families.rs"
      - "docs/tdi10/TDI-10.13-OPERATOR-FAMILY-WITNESSES.md"
      - "scripts/check-tdi10.13-operator-families.sh"
      - ".github/workflows/tdi10.13-operator-families.yml"

permissions:
  contents: read

jobs:
  operator-family-witnesses:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.13 operator family witnesses
        run: bash scripts/check-tdi10.13-operator-families.sh
