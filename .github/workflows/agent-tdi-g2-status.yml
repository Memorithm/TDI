name: Agent TDI G2 status synchronization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'industrialize/hub-authoritative-publication-g2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: industrialize/hub-authoritative-publication-g2
          fetch-depth: 0
      - name: Apply status synchronization
        run: python3 .agent/update_tdi_g2_status.py
      - name: Compile contracts
        run: |
          PYTHONPATH=scripts python3 -m py_compile \
            scripts/tdi_experiment_contract.py \
            scripts/tdi_artifact_contract.py \
            scripts/tdi_hub_edge_contract.py \
            scripts/test_tdi_hub_edge_contract.py
      - name: Run Hub edge contract regressions
        run: PYTHONPATH=scripts python3 -m unittest scripts/test_tdi_hub_edge_contract.py -v
      - name: Persist candidate status and remove one-shot files
        shell: bash
        run: |
          rm .agent/update_tdi_g2_status.py
          rm .github/workflows/agent-tdi-g2-status.yml
          git config user.name "ZEKRITI TAREK"
          git config user.email "contact@checkupauto.fr"
          git add docs/engineering/industrialization-status.md .agent/update_tdi_g2_status.py .github/workflows/agent-tdi-g2-status.yml
          git commit -m "docs(engine): record Hub authoritative publication candidate"
          git push origin HEAD:industrialize/hub-authoritative-publication-g2
