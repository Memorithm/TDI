name: TDI-10.11 product exp bounds

on:
  pull_request:
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/tests/cavity_product_exp_bounds.rs"
      - "docs/tdi10/TDI-10.11-PRODUCT-EXP-BOUNDS.md"
      - "scripts/check-tdi10.11-product-exp-bounds.sh"
      - ".github/workflows/tdi10.11-product-exp-bounds.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/tests/cavity_product_exp_bounds.rs"
      - "docs/tdi10/TDI-10.11-PRODUCT-EXP-BOUNDS.md"
      - "scripts/check-tdi10.11-product-exp-bounds.sh"
      - ".github/workflows/tdi10.11-product-exp-bounds.yml"

permissions:
  contents: read

jobs:
  product-exp-bounds:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.11 product exp bounds
        run: bash scripts/check-tdi10.11-product-exp-bounds.sh
