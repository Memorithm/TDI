name: Rust validation

on:
  push:
    branches:
      - main
      - tdi-2-branching
      - tdi-3-interwidth
      - tdi-4-target-geometry
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tdi-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TDI_CI_RUST: "1.97.1"

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
      - name: Run tests
        run: cargo test --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: clippy
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  integrity:
    name: Preregistration integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Verify historical preregistration and scientific-code hashes
        run: |
          sha256sum -c docs/TDI-2-CONTINUOUS-PREREGISTRATION.sha256
          sha256sum -c docs/TDI-3-INTERWIDTH-PREREGISTRATION.sha256
          sha256sum -c docs/TDI-3-INTERWIDTH-EVALUATOR.sha256
          sha256sum -c docs/TDI-3-SCIENTIFIC-CODE.sha256
          sha256sum -c docs/TDI-4-TARGET-GEOMETRY-PREREGISTRATION.sha256
          sha256sum -c docs/TDI-4-TARGET-GEOMETRY-EVALUATOR.sha256
          sha256sum -c docs/TDI-4-SCIENTIFIC-CODE.sha256
          bash -n scripts/reproduce-tdi4.sh
      - name: Verify TDI-7.0 preregistration when present
        run: |
          if test -f docs/TDI-7.0-ATTENTION-RECOVERY-PREREGISTRATION.sha256; then
            sha256sum -c docs/TDI-7.0-ATTENTION-RECOVERY-PREREGISTRATION.sha256
          fi
      - name: Verify TDI-8.0 bootstrap when present
        run: |
          if test -f docs/TDI-8.0-ASSR-PREREGISTRATION.md; then
            bash -n scripts/check-tdi8-bootstrap.sh
            bash scripts/check-tdi8-bootstrap.sh
          fi
