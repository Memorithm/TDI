name: TDI-11 bootstrap integrity

on:
  pull_request:
    paths:
      - 'docs/TDI-11*'
      - 'scripts/check-tdi11-bootstrap.sh'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/tdi11-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'docs/TDI-11*'
      - 'scripts/check-tdi11-bootstrap.sh'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/tdi11-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify TDI-11.0 bootstrap contract
        shell: bash
        run: bash scripts/check-tdi11-bootstrap.sh
