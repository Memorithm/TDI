name: TDI-8.1 readiness integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify TDI-8.1 readiness integrity
        run: bash scripts/check-tdi8.1-readiness.sh
