name: TDI-10.18 Family hypothesis checklist

on:
  pull_request:
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_family_hypothesis_checklist.rs"
      - "docs/tdi10/TDI-10.18-FAMILY-HYPOTHESIS-CHECKLIST.md"
      - "scripts/check-tdi10.18-family-hypothesis-checklist.sh"
      - ".github/workflows/tdi10.18-family-hypothesis-checklist.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_family_hypothesis_checklist.rs"
      - "docs/tdi10/TDI-10.18-FAMILY-HYPOTHESIS-CHECKLIST.md"
      - "scripts/check-tdi10.18-family-hypothesis-checklist.sh"
      - ".github/workflows/tdi10.18-family-hypothesis-checklist.yml"

permissions:
  contents: read

jobs:
  family-hypothesis-checklist:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.18 family hypothesis checklist
        run: bash scripts/check-tdi10.18-family-hypothesis-checklist.sh
