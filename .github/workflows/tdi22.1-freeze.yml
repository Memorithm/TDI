name: TDI-22.1 freeze integrity

on:
  pull_request:
    paths:
      - 'docs/TDI-22.1*'
      - 'scripts/check-tdi22-freeze.sh'
      - 'scripts/check-tdi22.1-preregistration.sh'
      - 'scripts/check-tdi22.1-freeze.sh'
      - '.github/workflows/tdi22.1-freeze.yml'
      - 'tdi-ai/**'
      - 'results/**'
      - 'artifacts/**'
  push:
    branches:
      - main
    paths:
      - 'docs/TDI-22.1*'
      - 'scripts/check-tdi22-freeze.sh'
      - 'scripts/check-tdi22.1-preregistration.sh'
      - 'scripts/check-tdi22.1-freeze.sh'
      - '.github/workflows/tdi22.1-freeze.yml'
      - 'tdi-ai/**'
      - 'results/**'
      - 'artifacts/**'

permissions:
  contents: read

# This workflow is intentionally narrow: it qualifies the frozen non-final TDI-22.1 protocol.
jobs:
  freeze-integrity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Verify TDI-22.1 content-addressed freeze
        run: bash scripts/check-tdi22.1-freeze.sh
