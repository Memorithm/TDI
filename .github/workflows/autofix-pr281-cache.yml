name: Autofix PR281 provenance DAG cache

on:
  push:
    branches:
      - research/tdi-23.1-ir-provenance-validation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: research/tdi-23.1-ir-provenance-validation
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Patch memoized boundary validation and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tdi-ai/src/tdi23_ir_provenance.rs')
          text = path.read_text()

          replacements = [
              (
                  '    let mut validated_nodes = BTreeSet::new();\n',
                  '    let mut validated_nodes = BTreeMap::new();\n',
              ),
              (
                  '    validated: &mut BTreeSet<usize>,\n) -> Result<bool, ProvenanceError> {\n    let index = node_id.index();\n    if validated.contains(&index) {\n        return contains_boundary(ir, node_id, &mut BTreeSet::new());\n    }\n',
                  '    validated: &mut BTreeMap<usize, bool>,\n) -> Result<bool, ProvenanceError> {\n    let index = node_id.index();\n    if let Some(has_boundary) = validated.get(&index) {\n        return Ok(*has_boundary);\n    }\n',
              ),
              (
                  '    validated.insert(index);\n    Ok(has_boundary)\n}\n',
                  '    validated.insert(index, has_boundary);\n    Ok(has_boundary)\n}\n',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old[:80]!r}')
              text = text.replace(old, new, 1)

          start = text.find('\nfn contains_boundary(\n')
          end = text.find('\nfn first_boundary(\n')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('could not isolate obsolete contains_boundary helper')
          text = text[:start] + text[end:]

          marker = '''    #[test]\n    fn tdi23_1_root_validation_rejects_foreign_root() {\n'''
          if marker not in text:
              raise SystemExit('foreign-root regression marker missing')
          regression = '''    #[test]\n    fn tdi23_1_root_validation_memoizes_reused_dag_nodes() {\n        let mut ir = CategoricalAttentionIr::new();\n        let object = ir.add_atomic_object("H", 1).expect("H");\n        let mut node = ir.add_identity(object).expect("identity");\n        for _ in 0..40 {\n            node = ir.compose(node, node).expect("self composition");\n        }\n\n        let summary = validate_rooted_subgraph(&ir, node).expect("memoized DAG validation");\n        assert_eq!(summary.node_count(), 41);\n        assert_eq!(summary.nonlinear_boundary_count(), 0);\n    }\n\n'''
          text = text.replace(marker, regression + marker, 1)
          path.write_text(text)
          PY

          cargo fmt --all

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'ZEKRITI TAREK'
          git config user.email 'contact@checkupauto.fr'
          git rm .github/workflows/autofix-pr281-cache.yml
          git add tdi-ai/src/tdi23_ir_provenance.rs
          git diff --cached --check
          git commit -m 'fix(tdi23): memoize rooted DAG boundary validation'
          git push origin HEAD:research/tdi-23.1-ir-provenance-validation
