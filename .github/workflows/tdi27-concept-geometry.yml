name: TDI-27 concept geometry development

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/TDI-27-PROGRAMME.md'
      - 'docs/TDI-FORWARD-PROGRAM-ROADMAP.md'
      - 'scripts/check-tdi27-bootstrap.sh'
      - 'tdi-bench/src/concept_geometry_v27.rs'
      - 'tdi-bench/src/bin/tdi27_concept_geometry.rs'
      - 'tdi-bench/src/lib.rs'
      - '.github/workflows/tdi27-concept-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TDI_CI_RUST: "1.97.1"

jobs:
  concept-geometry-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: rustfmt, clippy
      - name: Bootstrap gate
        run: bash scripts/check-tdi27-bootstrap.sh
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p tdi-bench --all-targets -- -D warnings
      - name: Launch synthetic Development research
        run: cargo run --locked -p tdi-bench --bin tdi27_concept_geometry
