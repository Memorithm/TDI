name: TDI real library adapters

on:
  pull_request:
    paths: ['tdi-ai/**', 'tdi-bench/**', 'tdi-core/**', 'tdi-operator/**', 'Cargo*', 'scripts/tdi_*', 'scripts/test_tdi_*', 'docs/engineering/**', '.github/workflows/tdi-library-adapters.yml']
  push:
    branches: [main]
    paths: ['tdi-ai/**', 'tdi-bench/**', 'tdi-core/**', 'tdi-operator/**', 'Cargo*', 'scripts/tdi_*', 'scripts/test_tdi_*', 'docs/engineering/**', '.github/workflows/tdi-library-adapters.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-adapters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-libraries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integration-tdi
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: scripts
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: '-C debuginfo=0'
    steps:
      - name: Check out the exact TDI candidate head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: integration-tdi
      - name: Check out the pinned Hub dependency
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Memorithm/scirust-hub
          ref: ccdcb99a4573dbefb944af0df713101b100b5f78
          persist-credentials: false
          path: integration-hub
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - name: Build pinned actual Hub in its own Cargo context
        working-directory: integration-hub
        run: cargo build --locked -p scirust-hubd -p scirust-hub-worker
      - name: Qualify owned state, codecs, failures and actual library worker
        run: |
          cargo test --locked -p tdi-bench --test engine_adapters
          cargo test --locked -p tdi-ai --test experiment_contract --test bounded_migration
          cargo test --locked -p tdi-bench --doc engine_adapters
          cargo build --locked -p tdi-bench --example engine_adapter_worker
          cargo clippy --locked -p tdi-bench --example engine_adapter_worker --test engine_adapters
      - name: Exercise actual four-stage Hub graphs, separate-process restore and independent oracles
        env:
          TDI_HUBD_BIN: ${{ github.workspace }}/integration-hub/target/debug/scirust-hubd
          TDI_LIBRARY_WORKER: ${{ github.workspace }}/integration-tdi/target/debug/examples/engine_adapter_worker
        run: python3 -m unittest -v scripts/test_tdi_library_integration.py
