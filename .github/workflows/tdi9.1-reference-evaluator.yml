name: TDI-9.1 reference evaluator integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reference-evaluator:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run evaluator Clippy
        run: cargo clippy -p tdi-ai --test tdi9_reference_evaluator_compile --locked -- -D warnings

      - name: Verify TDI-9.1 reference evaluator
        run: bash scripts/check-tdi9.1-reference-evaluator.sh
