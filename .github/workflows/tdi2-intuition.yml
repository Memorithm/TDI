name: TDI-2.1 intuition reference
on:
  pull_request:
    paths:
      - "tdi-ai/src/tdi2_intuition*.rs"
      - "tdi-ai/src/experimental.rs"
      - "tdi-ai/tests/tdi2_intuition*.rs"
      - ".github/workflows/tdi2-intuition.yml"
  push:
    branches: [main]
    paths:
      - "tdi-ai/src/tdi2_intuition*.rs"
      - "tdi-ai/src/experimental.rs"
      - "tdi-ai/tests/tdi2_intuition*.rs"
      - ".github/workflows/tdi2-intuition.yml"
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p tdi-ai --all-targets --all-features -- -D warnings
      - run: cargo test --locked -p tdi-ai --all-features
  experimental-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - run: cargo check --locked -p tdi-ai --all-targets --all-features
