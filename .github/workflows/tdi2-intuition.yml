name: TDI-2.1 intuition reference
on:
  pull_request:
    paths:
      - "tdi-ai/src/tdi2_intuition*.rs"
      - "tdi-ai/src/tdi2_template_induction.rs"
      - "tdi-ai/src/tdi2_observation_graph.rs"
      - "tdi-ai/src/experimental.rs"
      - "tdi-ai/tests/tdi2_intuition*.rs"
      - "tdi-ai/examples/tdi2_intuition*.rs"
      - "tdi-ai/Cargo.toml"
      - "scripts/check-tdi2-cycle2-summary.sh"
      - "docs/research/tdi-2.1*"
      - ".github/workflows/tdi2-intuition.yml"
  push:
    branches: [main]
    paths:
      - "tdi-ai/src/tdi2_intuition*.rs"
      - "tdi-ai/src/tdi2_template_induction.rs"
      - "tdi-ai/src/tdi2_observation_graph.rs"
      - "tdi-ai/src/experimental.rs"
      - "tdi-ai/tests/tdi2_intuition*.rs"
      - "tdi-ai/examples/tdi2_intuition*.rs"
      - "tdi-ai/Cargo.toml"
      - "scripts/check-tdi2-cycle2-summary.sh"
      - "docs/research/tdi-2.1*"
      - ".github/workflows/tdi2-intuition.yml"
permissions:
  contents: read
jobs:
  reference:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tdi' || 'ubuntu-latest' }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p tdi-ai --all-targets --all-features -- -D warnings
      - run: cargo test --locked -p tdi-ai --all-features
      - run: bash scripts/check-tdi2-cycle2-summary.sh
  experimental-msrv:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tdi' || 'ubuntu-latest' }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install experimental MSRV
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.85.0
      - run: cargo check --locked -p tdi-ai --all-targets --all-features
