name: TDI-24.0 slice 04 channel decomposition contract

on:
  pull_request:
    paths:
      - 'tdi-ai/src/tdi24_chiral.rs'
      - 'docs/TDI-24-CAMPAIGN-50.md'
      - 'docs/TDI-24-CHANNEL-DECOMPOSITION.md'
      - 'scripts/check-tdi24-s04.sh'
      - '.github/workflows/tdi24-s04-channels.yml'
  push:
    branches: [main]
    paths:
      - 'tdi-ai/src/tdi24_chiral.rs'
      - 'docs/TDI-24-CAMPAIGN-50.md'
      - 'docs/TDI-24-CHANNEL-DECOMPOSITION.md'
      - 'scripts/check-tdi24-s04.sh'
      - '.github/workflows/tdi24-s04-channels.yml'

permissions:
  contents: read

concurrency:
  group: tdi24-s04-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  channel-decomposition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Qualify TDI-24 slice 04
        run: bash scripts/check-tdi24-s04.sh
