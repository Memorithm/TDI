name: TDI artifact and provenance contracts

on:
  pull_request:
    paths:
      - "scripts/tdi_experiment_contract.py"
      - "scripts/tdi_artifact_contract.py"
      - "scripts/test_tdi_artifact_contract.py"
      - "docs/TDI-ARTIFACT-PROVENANCE-CONTRACT.md"
      - "docs/engineering/industrialization-status.md"
      - ".github/workflows/tdi-artifact-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ${{ vars.TDI_LOCAL_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tdi' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile contract modules
        run: |
          python3 -m py_compile \
            scripts/tdi_experiment_contract.py \
            scripts/tdi_artifact_contract.py \
            scripts/test_tdi_artifact_contract.py
      - name: Run portable artifact contract tests
        run: |
          PYTHONPATH=scripts python3 -m unittest \
            scripts/test_tdi_artifact_contract.py -v
