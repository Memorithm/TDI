name: TDI-9.1 configuration freeze contract

on:
  pull_request:
    paths-ignore:
      - 'docs/engineering/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  configuration-freeze:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tdi' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify TDI-9 bootstrap integrity
        run: bash scripts/check-tdi9-bootstrap.sh

      - name: Validate non-executing configuration freeze
        run: python3 scripts/check-tdi9.1-configuration-freeze.py

      - name: Fail-closed freeze validator tests
        run: python3 scripts/test-tdi9.1-configuration-freeze.py

