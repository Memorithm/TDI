name: TDI-11.2 readiness integrity

on:
  pull_request:
    paths-ignore:
      - 'docs/engineering/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tdi' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify TDI-11.2 readiness integrity
        run: bash scripts/check-tdi11.2-readiness.sh

      - name: Fail-closed TDI-11.2 readiness tests
        run: python3 scripts/test-tdi11.2-readiness.py
