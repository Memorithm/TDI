name: Cancel superseded PR workflow runs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Cancel superseded PR runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CURRENT_SHA: ${{ github.event.pull_request.head.sha }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Cancel queued or running runs from older heads of this PR branch
        shell: bash
        run: |
          set -euo pipefail

          gh api             --method GET             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/${REPOSITORY}/actions/runs"             -f branch="${PR_BRANCH}"             -f event="pull_request"             -f per_page=100             --paginate             --jq '.workflow_runs[] | [.id, .head_sha, .status, .name] | @tsv' |
          while IFS=$'\t' read -r run_id head_sha status name; do
            [[ -n "${run_id}" ]] || continue
            [[ "${run_id}" != "${CURRENT_RUN_ID}" ]] || continue
            [[ "${head_sha}" != "${CURRENT_SHA}" ]] || continue

            case "${status}" in
              queued|in_progress|waiting|pending|requested)
                echo "Cancelling superseded run: id=${run_id} sha=${head_sha} status=${status} workflow=${name}"
                gh api                   --method POST                   -H "Accept: application/vnd.github+json"                   -H "X-GitHub-Api-Version: 2022-11-28"                   "repos/${REPOSITORY}/actions/runs/${run_id}/cancel"                   >/dev/null || true
                ;;
            esac
          done
