name: TDI-23.2 bounded local rewrite calculus

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tdi23-2-rewrite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-local-rewrite:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify TDI-23.2 bounded local rewrite calculus
        run: bash scripts/check-tdi23.2-rewrite.sh
