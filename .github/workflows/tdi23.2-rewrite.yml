name: TDI-23.2 bounded local rewrite calculus

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tdi23-2-rewrite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-local-rewrite:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify TDI-23.2 bounded local rewrite calculus
        run: bash scripts/check-tdi23.2-rewrite.sh
