name: TDI-23.2 bounded local rewrite calculus

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tdi23-2-rewrite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-local-rewrite:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify TDI-23.2 bounded local rewrite calculus
        run: bash scripts/check-tdi23.2-rewrite.sh
