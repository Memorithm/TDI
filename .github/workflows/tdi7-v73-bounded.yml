name: TDI-7.3 bounded evaluator

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tdi73-bounded-${{ github.ref }}
  cancel-in-progress: true

env:
  TDI_CI_RUST: "1.97.1"

jobs:
  bounded-evaluator:
    name: TDI-7.3 bounded evaluator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: rustfmt,clippy
      - name: Check TDI-7.3 source formatting
        run: |
          rustfmt --edition 2024 --check \
            tdi-bench/src/lib.rs \
            tdi-bench/src/attention_v7.rs \
            tdi-bench/src/predictive_v7.rs \
            tdi-bench/src/bin/tdi-attention-v71-tasks.rs \
            tdi-bench/src/bin/tdi-attention-v71-interventions.rs \
            tdi-bench/src/bin/tdi-attention-v73.rs \
            tdi-bench/src/bin/tdi-attention-v73-predictive.rs
      - name: Check bounded evaluators with Clippy
        run: >-
          cargo clippy -p tdi-bench --lib
          --bin tdi-attention-v71-tasks
          --bin tdi-attention-v71-interventions
          --bin tdi-attention-v73
          --bin tdi-attention-v73-predictive
          --locked -- -D warnings
      - name: Run shared mechanics and TDI-7.3 tests
        run: >-
          cargo test -p tdi-bench --lib
          --bin tdi-attention-v71-tasks
          --bin tdi-attention-v71-interventions
          --bin tdi-attention-v73
          --bin tdi-attention-v73-predictive
          --locked
      - name: Execute bounded TDI-7.3 mechanistic evaluator
        shell: bash
        run: |
          output="$(cargo run -q -p tdi-bench --bin tdi-attention-v73 --locked)"
          printf '%s\n' "$output"
          grep -Fx 'scope=development+validation' <<<"$output"
          grep -Fx 'semantic=deterministic_local_row_stochastic_v1' <<<"$output"
          grep -Fx 'intervention=balanced_add_subtract_v1' <<<"$output"
          grep -Fx 'final_holdout=NOT_ACCESSED' <<<"$output"
          grep -Fx 'confirmatory_verdict=NOT_COMPUTED' <<<"$output"
          test "$(grep -c '^tdi73-bounded-v2;' <<<"$output")" -eq 4
      - name: Execute bounded TDI-7.3 predictive evaluator
        shell: bash
        run: |
          output="$(cargo run -q -p tdi-bench --bin tdi-attention-v73-predictive --locked)"
          printf '%s\n' "$output"
          grep -Fx 'scope=training+development+validation' <<<"$output"
          grep -Fx 'model_ladder=TDI-7.1_B0_B1_ridge' <<<"$output"
          grep -Fx 'bootstrap=generator_paired_percentile_95' <<<"$output"
          grep -Fx 'final_holdout=NOT_ACCESSED' <<<"$output"
          grep -Fx 'confirmatory_H_AI_2_verdict=NOT_COMPUTED' <<<"$output"
          test "$(grep -c '^tdi73-predictive-v1;' <<<"$output")" -eq 2
      - name: Prove final-run authorization is absent
        shell: bash
        run: |
          ! grep -R -F 'I_ACCEPT_THE_TDI7_HOLDOUT_FREEZE' \
            tdi-bench/src/lib.rs \
            tdi-bench/src/attention_v7.rs \
            tdi-bench/src/predictive_v7.rs \
            tdi-bench/src/bin/tdi-attention-v73.rs \
            tdi-bench/src/bin/tdi-attention-v73-predictive.rs
          ! grep -R -F 'TDI7_CONFIRM_FINAL_HOLDOUT' \
            tdi-bench/src/lib.rs \
            tdi-bench/src/attention_v7.rs \
            tdi-bench/src/predictive_v7.rs \
            tdi-bench/src/bin/tdi-attention-v73.rs \
            tdi-bench/src/bin/tdi-attention-v73-predictive.rs
