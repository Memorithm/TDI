name: TDI-25.0 slice 20 Stage-B audit
on:
  pull_request:
    paths:
      - 'tdi-ai/src/tdi25_tasks.rs'
      - 'tdi-ai/tests/tdi25_stage_b_audit.rs'
      - 'docs/TDI-25-CAMPAIGN-50.md'
      - 'docs/TDI-25-STAGE-B-AUDIT.md'
      - 'docs/tdi25-stage-b-freeze.yaml'
      - 'scripts/check-tdi25-s20.sh'
      - '.github/workflows/tdi25-s20-stage-b-audit.yml'
permissions:
  contents: read
jobs:
  stage-b-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: bash scripts/check-tdi25-s20.sh
