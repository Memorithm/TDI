name: TDI-25 slice 29 typed failure/resource accounting
on:
  pull_request:
    paths:
      - 'tdi-ai/src/tdi25_eval.rs'
      - 'tdi-ai/src/tdi25_matched_reference.rs'
      - 'tdi-ai/tests/tdi25_matched_reference.rs'
      - 'tdi-ai/tests/tdi25_production_pairing.rs'
      - 'tdi-ai/tests/tdi25_failure_resource_accounting.rs'
      - 'tdi-ai/src/tdi25_matched_matrix.rs'
      - 'docs/TDI-25-MATCHED-REFERENCE-V1.md'
      - 'docs/TDI-25-MATCHED-EVALUATOR-GATE.md'
      - 'docs/TDI-25-CAMPAIGN-50.md'
      - 'scripts/check-tdi25-s29.sh'
      - '.github/workflows/tdi25-s29-failure-resource-accounting.yml'
permissions:
  contents: read
jobs:
  failure-resource-accounting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: bash scripts/check-tdi25-s29.sh
