name: TDI-25 slice 21 T6 evaluator
on:
  pull_request:
    paths:
      - 'tdi-ai/src/tdi25_eval.rs'
      - 'tdi-ai/src/experimental.rs'
      - 'docs/TDI-25-CAMPAIGN-50.md'
      - 'scripts/check-tdi25-s21.sh'
      - '.github/workflows/tdi25-s21-t6-evaluator.yml'
permissions:
  contents: read
jobs:
  t6-evaluator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Diagnose rustfmt drift
        run: |
          cargo +1.97.1 fmt --all
          if ! git diff --quiet; then
            git diff --no-ext-diff -- tdi-ai/src/tdi25_eval.rs > /tmp/rustfmt.diff
            message=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' /tmp/rustfmt.diff)
            echo "::error file=tdi-ai/src/tdi25_eval.rs,line=1::$message"
            exit 1
          fi
      - run: bash scripts/check-tdi25-s21.sh
