name: TDI-25 slice 21 T6 evaluator
on:
  pull_request:
    paths:
      - 'tdi-ai/src/tdi25_eval.rs'
      - 'tdi-ai/src/tdi22_torsor.rs'
      - 'tdi-ai/src/tdi25_tasks.rs'
      - 'tdi-ai/src/tdi25_torsor_chiral.rs'
      - 'tdi-ai/src/experimental.rs'
      - 'docs/TDI-25-CAMPAIGN-50.md'
      - 'scripts/check-tdi25-s21.sh'
      - '.github/workflows/tdi25-s21-t6-evaluator.yml'
permissions:
  contents: read
jobs:
  t6-evaluator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: bash scripts/check-tdi25-s21.sh
