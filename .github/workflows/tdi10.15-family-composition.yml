name: TDI-10.15 Family composition

on:
  pull_request:
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_family_composition.rs"
      - "docs/tdi10/TDI-10.15-FAMILY-COMPOSITION.md"
      - "scripts/check-tdi10.15-family-composition.sh"
      - ".github/workflows/tdi10.15-family-composition.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_family_composition.rs"
      - "docs/tdi10/TDI-10.15-FAMILY-COMPOSITION.md"
      - "scripts/check-tdi10.15-family-composition.sh"
      - ".github/workflows/tdi10.15-family-composition.yml"

permissions:
  contents: read

jobs:
  family-composition:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.15 family composition
        run: bash scripts/check-tdi10.15-family-composition.sh
