name: TDI689 runner qualification
on:
  pull_request:
    paths: ['.github/workflows/tdi689-runner-qualification.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor == 'CHECKUPAUTO' && github.repository == 'Memorithm/TDI' && github.event.pull_request.number == 689 && github.event.pull_request.head.repo.full_name == 'Memorithm/TDI'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare bounded blobs only; connector owns workflow publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          prefix = '$' + '{{ '
          suffix = ' }}'
          condition = "(github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tdi' || 'ubuntu-24.04'"
          old = prefix + condition + suffix
          new = prefix + "vars.TDI_LOCAL_RUNNERS_ENABLED == 'true' && " + condition + suffix
          expected = set('''tdi-artifact-contract.yml tdi-forge-partner-contract.yml tdi-freeze-progress-summary.yml tdi-hub-edge-contract.yml tdi-observability.yml tdi-partner-adapter-contract.yml tdi-research-analysis.yml tdi11-model-observation-freeze.yml tdi11.2-readiness.yml tdi23-stage0-bootstrap.yml tdi23.1-equivalence.yml tdi23.1-ir.yml tdi23.1-provenance.yml tdi7-hosted-software.yml tdi7-prearm-ci.yml tdi7-v73-bounded.yml tdi7-v74-bounded.yml tdi7-v74-identifiability.yml tdi71-ci.yml tdi8-a0-a1-adapter.yml tdi8-a2-adapter.yml tdi8-a3-adapter.yml tdi8-a3-atomic-store-gate.yml tdi8-a3-atomic-store.yml tdi8-a3-routing.yml tdi8-configuration-freeze.yml tdi8-evaluable-predictions.yml tdi8-exact-readout.yml tdi8-operation-accounting.yml tdi8-percentile-interval.yml tdi8-readiness.yml tdi8-symbolic-rejections.yml tdi8-task-encoding.yml tdi9-configuration-freeze.yml tdi9-readiness.yml tdi9.1-reference-evaluator.yml tdi9.1-reference-rejections.yml'''.split())
          assert len(expected) == 37
          contents = []
          found = set()
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text()
              if old not in text:
                  continue
              assert path.name in expected, str(path)
              for line in text.splitlines():
                  if old in line:
                      assert line.strip() == 'runs-on: ' + old, str(path)
              revised = text.replace(old, new)
              assert revised.replace(new, old) == text
              found.add(path.name)
              contents.append((str(path), revised))
          assert found == expected, sorted(found ^ expected)
          doc = 'docs/engineering/CI_RUNNER_SELECTION.md'
          assert not Path(doc).exists()
          contents.append((doc, '''# Software CI runner selection

          The 37 standard software-gate workflows that previously selected the
          local `tdi` runner for same-repository PRs now default to their existing
          `ubuntu-24.04` hosted execution path. This avoids indefinite queueing
          when the local executor is unavailable.

          Set repository variable `TDI_LOCAL_RUNNERS_ENABLED` to the literal
          string `true` only when the local runner is qualified and available.
          Fork PRs still use hosted execution even when that opt-in is enabled.
          This is explicit runner selection, not automatic liveness detection.

          Commands, job names, dependencies, timeouts, checkout semantics,
          permissions, protected/final boundaries and scientific gates are
          unchanged. No failing test is skipped and no status is fabricated.
          The change was prompted by PR #689 jobs remaining queued with label
          `tdi`, runner_id 0, while other software gates completed.
          Hardware-specific measurements and protected/final jobs are not
          qualified or enabled by this setting. RemoteOps remains the host
          control plane; hosted runs establish software evidence only.
          '''))
          entries = []
          for path, content in contents:
              result = subprocess.run(
                  ['gh','api','--method','POST','repos/Memorithm/TDI/git/blobs','--input','-'],
                  input=json.dumps({'content':content,'encoding':'utf-8'}),
                  text=True,capture_output=True,check=True,
              )
              sha = json.loads(result.stdout)['sha']
              assert len(sha) == 40
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          entries.append({'path':'.github/workflows/tdi689-runner-qualification.yml','mode':'100644','type':'blob','sha':None})
          # Only unattached content blobs are staged. No tree, commit or ref is
          # published with this token. Authorized connector must review and
          # publish the bounded manifest, then ordinary CI runs on that head.
          print('TDI689_STAGED_MANIFEST=' + json.dumps(entries))
          print('TDI689_BASE_TREE=' + subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip())
          print('TDI689_PARENT=' + subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
