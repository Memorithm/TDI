name: TDI-10.5 pointwise-subunit counterexample

on:
  pull_request:
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/tests/cavity_pointwise_subunit_counterexample.rs"
      - "docs/tdi10/TDI-10.5-POINTWISE-SUBUNIT-COUNTEREXAMPLE.md"
      - "scripts/check-tdi10.5-pointwise-subunit-counterexample.sh"
      - ".github/workflows/tdi10.5-pointwise-subunit-counterexample.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/tests/cavity_pointwise_subunit_counterexample.rs"
      - "docs/tdi10/TDI-10.5-POINTWISE-SUBUNIT-COUNTEREXAMPLE.md"
      - "scripts/check-tdi10.5-pointwise-subunit-counterexample.sh"
      - ".github/workflows/tdi10.5-pointwise-subunit-counterexample.yml"

permissions:
  contents: read

jobs:
  pointwise-subunit-counterexample:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.5 pointwise-subunit counterexample
        run: bash scripts/check-tdi10.5-pointwise-subunit-counterexample.sh
