name: TDI-9.1 policy-accounting foundation

on:
  pull_request:
    paths:
      - 'tdi-ai/src/adaptive_inference.rs'
      - 'tdi-ai/tests/tdi9_adaptive_inference_compile.rs'
      - 'docs/TDI-9*'
      - 'scripts/check-tdi9*'
      - '.github/workflows/tdi9.1-foundation.yml'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
  push:
    branches:
      - main
    paths:
      - 'tdi-ai/src/adaptive_inference.rs'
      - 'tdi-ai/tests/tdi9_adaptive_inference_compile.rs'
      - 'docs/TDI-9*'
      - 'scripts/check-tdi9*'
      - '.github/workflows/tdi9.1-foundation.yml'

permissions:
  contents: read

env:
  TDI_CI_RUST: "1.97.1"

jobs:
  foundation:
    name: TDI-9.1 policy-accounting foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: rustfmt
      - name: Verify frozen TDI-9 bootstrap and bounded foundation
        run: |
          bash -n scripts/check-tdi9.1-foundation.sh
          bash scripts/check-tdi9.1-foundation.sh
