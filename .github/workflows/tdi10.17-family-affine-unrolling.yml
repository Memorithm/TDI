name: TDI-10.17 Family affine unrolling

on:
  pull_request:
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_family_affine_unrolling.rs"
      - "docs/tdi10/TDI-10.17-FAMILY-AFFINE-UNROLLING.md"
      - "scripts/check-tdi10.17-family-affine-unrolling.sh"
      - ".github/workflows/tdi10.17-family-affine-unrolling.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_family_affine_unrolling.rs"
      - "docs/tdi10/TDI-10.17-FAMILY-AFFINE-UNROLLING.md"
      - "scripts/check-tdi10.17-family-affine-unrolling.sh"
      - ".github/workflows/tdi10.17-family-affine-unrolling.yml"

permissions:
  contents: read

jobs:
  family-affine-unrolling:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.17 family affine unrolling
        run: bash scripts/check-tdi10.17-family-affine-unrolling.sh
