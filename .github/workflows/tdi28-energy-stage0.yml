name: TDI-28 energy-aware Boolean Stage-0

on:
  pull_request:
    paths:
      - 'tdi-ai/src/tdi28_energy_algebra.rs'
      - 'tdi-ai/src/tdi28_trace.rs'
      - 'tdi-ai/src/tdi28_c3_policy.rs'
      - 'tdi-ai/src/experimental.rs'
      - 'docs/TDI-28-PROGRAMME.md'
      - '.github/workflows/tdi28-energy-stage0.yml'
  push:
    branches:
      - main
    paths:
      - 'tdi-ai/src/tdi28_energy_algebra.rs'
      - 'tdi-ai/src/tdi28_trace.rs'
      - 'tdi-ai/src/tdi28_c3_policy.rs'
      - 'tdi-ai/src/experimental.rs'
      - 'docs/TDI-28-PROGRAMME.md'
      - '.github/workflows/tdi28-energy-stage0.yml'

permissions:
  contents: read

concurrency:
  group: tdi28-energy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage0-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Stage-0 correctness and static checks
        run: |
          cargo fmt --all -- --check
          cargo test -p tdi-ai --features experimental --lib tdi28_ --locked
          cargo clippy -p tdi-ai --features experimental --all-targets --locked -- -D warnings
