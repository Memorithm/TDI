name: TDI-10.4 chain unrolling

on:
  pull_request:
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/lib.rs"
      - "tdi-operator/tests/cavity_chain.rs"
      - "docs/tdi10/TDI-10.4-CHAIN-UNROLLING.md"
      - "scripts/check-tdi10.4-chain-unrolling.sh"
      - ".github/workflows/tdi10.4-chain-unrolling.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/lib.rs"
      - "tdi-operator/tests/cavity_chain.rs"
      - "docs/tdi10/TDI-10.4-CHAIN-UNROLLING.md"
      - "scripts/check-tdi10.4-chain-unrolling.sh"
      - ".github/workflows/tdi10.4-chain-unrolling.yml"

permissions:
  contents: read

jobs:
  chain-unrolling:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.4 exact finite-chain unrolling
        run: bash scripts/check-tdi10.4-chain-unrolling.sh
