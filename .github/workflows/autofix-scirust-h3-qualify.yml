name: Qualify SciRust H3 candidate

on:
  push:
    branches:
      - industrialize/scirust-partner-h3

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v7
        with:
          ref: industrialize/scirust-partner-h3
          fetch-depth: 0

      - name: Run bounded contract qualification
        run: |
          PYTHONPATH=scripts python3 -m py_compile \
            scripts/tdi_experiment_contract.py \
            scripts/tdi_artifact_contract.py \
            scripts/tdi_execution_graph.py \
            scripts/tdi_hub_edge_contract.py \
            scripts/tdi_hub_admission_contract.py \
            scripts/tdi_partner_adapter_contract.py \
            scripts/tdi_scirust_partner_contract.py \
            scripts/test_tdi_hub_admission_contract.py \
            scripts/test_tdi_partner_adapter_contract.py \
            scripts/test_tdi_scirust_partner_contract.py
          PYTHONPATH=scripts python3 -m unittest \
            scripts/test_tdi_hub_admission_contract.py \
            scripts/test_tdi_partner_adapter_contract.py \
            scripts/test_tdi_scirust_partner_contract.py -v

      - name: Synchronize industrialization status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/engineering/industrialization-status.md')
          text = p.read_text()

          baseline_anchor = '- Lot H Forge-specific boundary: PR #277, final head `942156e718c812ff0725f706ecc6adf51ea4a0a7`, merged `183fcd6af2ddfefce4a5708e72f683d14118dbdf` after every returned exact-head workflow completed successfully, including `TDI Forge partner contracts`, common partner/Hub/artifact gates, Rust/Public Rust and MSRV. It remains a non-executing interchange contract and grants no Forge, holdout, stage, verdict or actuation authority.\n'
          elastic_baseline = '- Lot H ElasticXxx-specific boundary: PR #279, final head `29d9f5555483b59c591ccb7d4871e84ac02d677c`, merged `6e2a15a5711f8dc2eb7e77886bbed247aa425e6b`. It pins the audited non-actuating `elastic.hub.run@1.0.0` / OperatorConfig/v1 / runtime-evidence-v1 surface, admits only observe/plan/dry-run intent, and grants no Elastic execution, physical actuation, holdout, stage or verdict authority.\n'
          if elastic_baseline not in text:
              if baseline_anchor not in text:
                  raise SystemExit('Lot H Forge baseline anchor missing')
              text = text.replace(baseline_anchor, baseline_anchor + elastic_baseline, 1)

          old_elastic = '| H ElasticXxx resource-control boundary | candidate | PR #279 pins audited ElasticXxx source `50bb85ea84191c01d95e5b4e5e3c81af10e95ebd`, `elastic.hub.run@1.0.0`, OperatorConfig/v1 and runtime-evidence-v1; it admits only observe/plan/dry-run intent and keeps execution/actuation/scientific authority false. Exact-head qualification and review are pending. |'
          new_elastic = '| H ElasticXxx resource-control boundary | qualified | PR #279 final head `29d9f5555483b59c591ccb7d4871e84ac02d677c`, merge `6e2a15a5711f8dc2eb7e77886bbed247aa425e6b`; the source-pinned contract remains non-actuating and grants no execution, holdout, stage, verdict or runtime-actuation authority. |'
          if old_elastic in text:
              text = text.replace(old_elastic, new_elastic, 1)
          elif new_elastic not in text:
              raise SystemExit('ElasticXxx capability status anchor missing')

          scirust_row = '| H SciRust reusable-primitive boundary | candidate | This branch pins SciRust `aa13f62ea829c5c42e370a32d51143f016a0dc44` and the exact `scirust-tensor-ir` representation module/API tuple, accepts only Development/Validation candidate artifacts, and compiles review metadata with promotion/execution/scientific authority hard-false. Exact-head PR qualification and review remain pending. |'
          if scirust_row not in text:
              text = text.replace(new_elastic + '\n', new_elastic + '\n' + scirust_row + '\n', 1)

          old_q12 = '| Q12 | partial | The common Lot H boundary and Forge-specific interchange are qualified by #273/#275/#277. ElasticXxx-specific non-actuating interchange is candidate #279; SciRust, FLAT-ATTENTION and NNIS partner-specific slices remain planned. Partner execution remains separately unqualified. |'
          new_q12 = '| Q12 | partial | The common Lot H boundary plus Forge and ElasticXxx interchanges are qualified by #273/#275/#277/#279. The SciRust reusable-primitive interchange is the current candidate; FLAT-ATTENTION and NNIS slices remain planned. Partner execution and primitive promotion remain separately unqualified. |'
          if old_q12 in text:
              text = text.replace(old_q12, new_q12, 1)
          elif new_q12 not in text:
              raise SystemExit('Q12 status anchor missing')

          p.write_text(text)
          PY

      - name: Commit synchronized candidate and remove one-shot workflow
        run: |
          git config user.name 'ZEKRITI TAREK'
          git config user.email 'contact@checkupauto.fr'
          git rm .github/workflows/autofix-scirust-h3-qualify.yml
          git add docs/engineering/industrialization-status.md
          git diff --cached --check
          git commit -m 'docs(engine): sync qualified Elastic and SciRust candidate'
          git push origin HEAD:industrialize/scirust-partner-h3
