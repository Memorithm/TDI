name: TDI-10.6 uniform subunit decay

on:
  pull_request:
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/tests/cavity_uniform_subunit_decay.rs"
      - "docs/tdi10/TDI-10.6-UNIFORM-SUBUNIT-DECAY.md"
      - "scripts/check-tdi10.6-uniform-subunit-decay.sh"
      - ".github/workflows/tdi10.6-uniform-subunit-decay.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/tests/cavity_uniform_subunit_decay.rs"
      - "docs/tdi10/TDI-10.6-UNIFORM-SUBUNIT-DECAY.md"
      - "scripts/check-tdi10.6-uniform-subunit-decay.sh"
      - ".github/workflows/tdi10.6-uniform-subunit-decay.yml"

permissions:
  contents: read

jobs:
  uniform-subunit-decay:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.6 uniform subunit decay lemma
        run: bash scripts/check-tdi10.6-uniform-subunit-decay.sh
