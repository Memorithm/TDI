name: TDI-10.12 Cesaro mean remainder rate

on:
  pull_request:
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/tests/cavity_cesaro_mean_remainder_rate.rs"
      - "docs/tdi10/TDI-10.12-CESARO-MEAN-REMAINDER-RATE.md"
      - "scripts/check-tdi10.12-cesaro-rate.sh"
      - ".github/workflows/tdi10.12-cesaro-rate.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/tests/cavity_cesaro_mean_remainder_rate.rs"
      - "docs/tdi10/TDI-10.12-CESARO-MEAN-REMAINDER-RATE.md"
      - "scripts/check-tdi10.12-cesaro-rate.sh"
      - ".github/workflows/tdi10.12-cesaro-rate.yml"

permissions:
  contents: read

jobs:
  cesaro-mean-remainder-rate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.12 Cesaro mean remainder rate
        run: bash scripts/check-tdi10.12-cesaro-rate.sh
