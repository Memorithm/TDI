name: TDI689 complete matched reference
on:
  pull_request:
    paths: ['.github/workflows/tdi689-complete-reference.yml']
permissions:
  contents: write
concurrency:
  group: tdi689-complete-matched-reference
  cancel-in-progress: false
jobs:
  qualify:
    if: github.actor == 'CHECKUPAUTO' && github.repository == 'Memorithm/TDI' && github.event.pull_request.number == 689 && github.event.pull_request.head.repo.full_name == 'Memorithm/TDI' && github.event.pull_request.head.ref == 'agent/tdi25-s28-family-stratified-synthesis'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Lock prospective population and format included Rust source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tdi-ai/src/tdi25_matched_reference.rs')
          text = p.read_text()
          anchor = '    #[test]\n    fn invalid_budgets_fail_before_scoring()'
          assert text.count(anchor) == 1
          text = text.replace(anchor, '''    #[test]
              fn generation_matches_the_prospective_known_answer() {
                  assert_eq!(MAX_CASES_PER_RUN, 64);
                  assert_eq!(MAX_SEED_BLOCKS_PER_SYNTHESIS, 64);
                  let input = generate_input(DataSplit::Development, TaskFamily::TorsorFavorable, 0, 0);
                  assert_eq!(input.query, [-0.5, 0.0, -1.5, 0.5, 0.5, -0.5]);
                  assert_eq!(input.key, [-0.5, 1.5, 1.0, 0.0, 1.0, 0.5]);
                  assert_eq!(input.key_position, [1.0, -2.0, 0.5]);
                  assert_eq!(input.query_position, [-2.0, 0.5, 0.0]);
              }

          ''' + anchor, 1)
          p.write_text(text)
          p = Path('scripts/check-tdi25-s28.sh')
          text = p.read_text()
          anchor = 'cargo +1.97.1 fmt --all -- --check\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + 'rustfmt +1.97.1 --edition 2024 --check tdi-ai/src/tdi25_matched_reference.rs\n', 1)
          p.write_text(text)
          PY
          rustfmt +1.97.1 --edition 2024 tdi-ai/src/tdi25_matched_reference.rs
          cargo +1.97.1 fmt --all
          git diff --check
      - name: Qualify final source without changing protocol or targets
        run: |
          set -euo pipefail
          bash scripts/check-tdi25-s28.sh
          bash scripts/check-tdi25-matched-matrix.sh
          cargo +1.97.1 test -p tdi-ai --features experimental --doc
          echo TDI689_FINAL_SOURCE_QUALIFIED
      - name: Publish validated source only to the same PR
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch=agent/tdi25-s28-family-stratified-synthesis
          gh auth setup-git
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed == {'tdi-ai/src/tdi25_matched_reference.rs','scripts/check-tdi25-s28.sh'}, sorted(changed)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tdi-ai/src/tdi25_matched_reference.rs scripts/check-tdi25-s28.sh
          git commit -m 'test(tdi25): pin matched population known answer and source formatting'
          git push origin "HEAD:refs/heads/$branch"
          printf 'TDI689_FINAL_SOURCE_HEAD=%s\n' "$(git rev-parse HEAD)"
