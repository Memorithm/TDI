name: TDI priority protected validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tdi-priority-protected.yml'
      - 'scripts/run-tdi-priority-check.sh'

permissions:
  contents: read

concurrency:
  group: tdi-priority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TDI_CI_RUST: '1.97.1'

jobs:
  formatting:
    name: Formatting
    runs-on: [self-hosted, Linux, ARM64, tdi-priority]
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: rustfmt
      - run: bash scripts/run-tdi-priority-check.sh formatting

  tests:
    name: Tests
    runs-on: [self-hosted, Linux, ARM64, tdi-priority]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
      - run: bash scripts/run-tdi-priority-check.sh tests

  clippy:
    name: Clippy
    runs-on: [self-hosted, Linux, ARM64, tdi-priority]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: clippy
      - run: bash scripts/run-tdi-priority-check.sh clippy

  integrity:
    name: Preregistration integrity
    runs-on: [self-hosted, Linux, ARM64, tdi-priority]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: rustfmt, clippy
      - run: bash scripts/run-tdi-priority-check.sh integrity

  public-formatting:
    name: Public formatting
    runs-on: [self-hosted, Linux, ARM64, tdi-priority]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: rustfmt
      - run: bash scripts/run-tdi-priority-check.sh public-formatting

  public-tests:
    name: Public tests
    runs-on: [self-hosted, Linux, ARM64, tdi-priority]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
      - run: bash scripts/run-tdi-priority-check.sh public-tests

  public-clippy:
    name: Public clippy
    runs-on: [self-hosted, Linux, ARM64, tdi-priority]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: clippy
      - run: bash scripts/run-tdi-priority-check.sh public-clippy

  public-integrity:
    name: Public preregistration integrity
    runs-on: [self-hosted, Linux, ARM64, tdi-priority]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.TDI_CI_RUST }}
          components: rustfmt, clippy
      - run: bash scripts/run-tdi-priority-check.sh public-integrity

  msrv:
    name: Rust MSRV
    runs-on: [self-hosted, Linux, ARM64, tdi-priority]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read declared MSRV
        id: msrv
        shell: bash
        run: |
          mapfile -t versions < <(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test "${#versions[@]}" -eq 1
          test -n "${versions[0]}"
          echo "version=${versions[0]}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: bash scripts/run-tdi-priority-check.sh msrv
