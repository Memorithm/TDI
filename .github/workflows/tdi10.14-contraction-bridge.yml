name: TDI-10.14 Contraction Type-U bridge

on:
  pull_request:
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_contraction_type_u_bridge.rs"
      - "docs/tdi10/TDI-10.14-CONTRACTION-TYPE-U-BRIDGE.md"
      - "scripts/check-tdi10.14-contraction-bridge.sh"
      - ".github/workflows/tdi10.14-contraction-bridge.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/frozen.rs"
      - "tdi-operator/tests/cavity_contraction_type_u_bridge.rs"
      - "docs/tdi10/TDI-10.14-CONTRACTION-TYPE-U-BRIDGE.md"
      - "scripts/check-tdi10.14-contraction-bridge.sh"
      - ".github/workflows/tdi10.14-contraction-bridge.yml"

permissions:
  contents: read

jobs:
  contraction-type-u-bridge:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.14 contraction Type-U bridge
        run: bash scripts/check-tdi10.14-contraction-bridge.sh
