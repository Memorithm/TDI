name: One-shot sync Lot G1 Hub edge status

on:
  push:
    branches:
      - industrialize/hub-portable-artifact-g1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: industrialize/hub-portable-artifact-g1
          fetch-depth: 0
      - name: Synchronize status and qualify contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/engineering/industrialization-status.md')
          text = path.read_text()

          old = '- Post-Lot-F base: `494240ebc5cd8d9418ce8c174dd65a4bc4e17651`.\n'
          new = old + (
              '- Hub portable-artifact prerequisite: `Memorithm/scirust-hub` PR #47 merged as '
              '`9f666225b186fbca6160dd34068aea1c9af57040`; the qualified endpoint re-verifies '
              'stored bytes against Hub digest and size before returning ordinary SHA-256, with bounded '
              'portable-digest scan concurrency.\n'
          )
          if old not in text:
              raise SystemExit('baseline marker not found')
          text = text.replace(old, new, 1)

          old = '| F physical CAS/registry | intentionally delegated | Hub remains owner of physical content-addressed storage, registry persistence and transport. |\n'
          new = old + (
              '| G1 Hub portable artifact binding | candidate | `HubArtifactBinding/v1` pins the qualified Hub #47 source, Hub artifact id/domain digest, exact TDI ArtifactDescriptor identity and raw-SHA256/size agreement; execution and authoritative publication are hard-false. |\n'
              '| G authoritative publication | blocked | Hub issue #46 still lacks a qualified durable generation/fencing contract atomically guarding authoritative publication across retries/restarts. TDI must not implement that generic lease/fence authority locally. |\n'
          )
          if old not in text:
              raise SystemExit('capability marker not found')
          text = text.replace(old, new, 1)

          old = '| Q16-Q17 | planned | real Hub edge, fencing and deduplicated authoritative publication. |\n'
          new = ('| Q16-Q17 | candidate / blocked | portable artifact translation is now represented by the fail-closed G1 contract pinned to Hub #47; '
                 'execution/publication remain unauthorized until Hub-owned durable fencing/generation (issue #46) and atomic authoritative publication are qualified. |\n')
          if old not in text:
              raise SystemExit('qualification marker not found')
          text = text.replace(old, new, 1)

          old = '- Hub `ContentDigest` at pinned source is domain-separated (`scirust-hub-digest:v1` + framed domain + bytes) and is not interchangeable with TDI portable raw SHA-256. Lot F therefore records raw payload SHA-256 for portable verification and explicitly forbids treating that value as a Hub CAS key without verified translation.\n'
          new = old + (
              '- Hub PR #47 provides that verified translation surface for artifact identity only: TDI G1 checks the returned ordinary SHA-256 and byte count against ArtifactDescriptor/v1 while retaining Hub ContentDigest as opaque translation provenance. The bridge does not authenticate transport itself and does not create execution/publication authority.\n'
          )
          if old not in text:
              raise SystemExit('cross-repository marker not found')
          text = text.replace(old, new, 1)

          old = '1. Add a real TDI↔Hub capability/publication edge that atomically enforces component, capability and portable-artifact pins; keep execution fail-closed while Hub v1 lacks a qualified fencing/generation token.\n2. Qualify lease fencing and authoritative publication in Hub-owned orchestration before TDI treats remote publication as authoritative.\n'
          new = ('1. Qualify the G1 portable-artifact binding against Hub #47 while keeping `execution_authorized=false` and `publication_authoritative=false`; component/capability pins still require an atomic authoritative edge.\n'
                 '2. Implement and qualify Hub issue #46 in Hub-owned orchestration: durable monotone fencing/generation plus atomic authoritative publication across retry, cancellation and restart. Only then may TDI advance the real edge.\n')
          if old not in text:
              raise SystemExit('next marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          PYTHONPATH=scripts python3 -m py_compile \
            scripts/tdi_experiment_contract.py \
            scripts/tdi_artifact_contract.py \
            scripts/tdi_hub_edge_contract.py \
            scripts/test_tdi_artifact_contract.py \
            scripts/test_tdi_hub_edge_contract.py
          PYTHONPATH=scripts python3 -m unittest \
            scripts/test_tdi_artifact_contract.py \
            scripts/test_tdi_hub_edge_contract.py -v

          rm .github/workflows/oneshot-sync-lot-g1-status.yml
          git config user.name 'ZEKRITI TAREK'
          git config user.email 'contact@checkupauto.fr'
          git add -A
          git commit -m 'docs(engine): record fail-closed Lot G1 Hub bridge'
          git push origin HEAD:industrialize/hub-portable-artifact-g1
