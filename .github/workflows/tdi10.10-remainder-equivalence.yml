name: TDI-10.10 remainder product equivalence

on:
  pull_request:
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/tests/cavity_remainder_product_equivalence.rs"
      - "docs/tdi10/TDI-10.10-REMAINDER-PRODUCT-EQUIVALENCE.md"
      - "scripts/check-tdi10.10-remainder-equivalence.sh"
      - ".github/workflows/tdi10.10-remainder-equivalence.yml"
  push:
    branches:
      - main
    paths:
      - "tdi-operator/src/chain.rs"
      - "tdi-operator/src/transport.rs"
      - "tdi-operator/tests/cavity_remainder_product_equivalence.rs"
      - "docs/tdi10/TDI-10.10-REMAINDER-PRODUCT-EQUIVALENCE.md"
      - "scripts/check-tdi10.10-remainder-equivalence.sh"
      - ".github/workflows/tdi10.10-remainder-equivalence.yml"

permissions:
  contents: read

jobs:
  remainder-equivalence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Qualify TDI-10.10 remainder product equivalence
        run: bash scripts/check-tdi10.10-remainder-equivalence.sh
