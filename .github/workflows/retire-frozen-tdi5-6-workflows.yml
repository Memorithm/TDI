name: Retire frozen TDI-5.x and TDI-6.x workflows

on:
  pull_request:
    paths:
      - '.github/workflows/retire-frozen-tdi5-6-workflows.yml'
      - 'AGENTS.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/retire-frozen-tdi5-6-workflows.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  retire:
    name: Disable historical frozen workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Disable frozen/completed historical workflows without editing them
        shell: bash
        run: |
          set -euo pipefail

          workflows=(
            tdi5-ci.yml
            tdi51-ci.yml
            tdi52-ci.yml
            tdi53-ci.yml
            tdi54-ci.yml
            tdi55-ci.yml
            tdi56-ci.yml
            tdi57-ci.yml
            tdi58-ci.yml
            tdi59-ci.yml
            tdi61-ci.yml
            tdi62-ci.yml
            tdi63-ci.yml
            tdi64-ci.yml
            tdi65-ci.yml
            tdi66-ci.yml
            tdi67-ci.yml
            tdi68-ci.yml
            tdi71-ci.yml
          )

          for workflow in "${workflows[@]}"; do
            echo "Disabling frozen workflow: ${workflow}"
            gh api               --method PUT               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "repos/${REPOSITORY}/actions/workflows/${workflow}/disable"
          done

          for workflow in "${workflows[@]}"; do
            state="$(
              gh api                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "repos/${REPOSITORY}/actions/workflows/${workflow}"                 --jq '.state'
            )"
            if [[ "${state}" != "disabled_manually" ]]; then
              echo "workflow ${workflow} state is ${state}, expected disabled_manually" >&2
              exit 1
            fi
          done
