name: TDI sensitivity and ablation
on:
  pull_request:
    paths: ['scripts/tdi_*', 'scripts/test_tdi_*', 'scripts/requirements-sensitivity.txt', 'tdi-ai/**', 'tdi-core/**', 'Cargo.*', 'docs/engineering/**', '.github/workflows/tdi-sensitivity.yml']
  push:
    branches: [main]
    paths: ['scripts/tdi_*', 'scripts/test_tdi_*', 'scripts/requirements-sensitivity.txt', 'tdi-ai/**', 'tdi-core/**', 'Cargo.*', 'docs/engineering/**', '.github/workflows/tdi-sensitivity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tdi-sensitivity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: '-C debuginfo=0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact TDI candidate head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: integration-tdi
      - name: Check out the pinned SciRust candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Memorithm/scirust
          ref: 06c9eaef248c0f40b7d363c16a7b4c1c1c54a5a0
          persist-credentials: false
          path: integration-scirust
      - name: Check out the pinned Hub dependency
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Memorithm/scirust-hub
          ref: ccdcb99a4573dbefb944af0df713101b100b5f78
          persist-credentials: false
          path: integration-hub
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - run: cargo build --locked -p scirust-stats --example research_stats
        working-directory: integration-scirust
      - run: cargo build --locked -p scirust-hubd -p scirust-hub-worker
        working-directory: integration-hub
      - run: cargo build --locked -p tdi-ai --example durable_worker
        working-directory: integration-tdi
      - name: Install the optional sensitivity profile
        working-directory: integration-tdi
        run: |
          python3 -m venv .sensitivity-venv
          .sensitivity-venv/bin/python -m pip install -r scripts/requirements-sensitivity.txt
      - name: Execute real sensitivity and independent references
        working-directory: integration-tdi
        env:
          PYTHONPATH: scripts
          TDI_SCIRUST_STATS_BIN: ${{ github.workspace }}/integration-scirust/target/debug/examples/research_stats
          TDI_SCIRUST_SOURCE_COMMIT: 06c9eaef248c0f40b7d363c16a7b4c1c1c54a5a0
          TDI_HUBD_BIN: ${{ github.workspace }}/integration-hub/target/debug/scirust-hubd
          TDI_DURABLE_WORKER: ${{ github.workspace }}/integration-tdi/target/debug/examples/durable_worker
        run: .sensitivity-venv/bin/python -m unittest -v scripts/test_tdi_sensitivity.py scripts/test_tdi_research_analysis.py scripts/test_tdi_analysis_integration.py
