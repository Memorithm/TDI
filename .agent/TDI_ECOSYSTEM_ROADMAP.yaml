    name: Confirmatory H_AI_1 final holdout
    status: complete_frozen_accessed_once_runner_retired
    agent_policy: forbidden_to_rerun_or_reinterpret
  - id: TDI8_0
    name: Recurrent associative architecture preregistration
    status: complete_merged_frozen
    primary_contrasts:
      - A2_vs_A1
      - A3_vs_A2
  - id: TDI8_1
    name: Bounded deterministic ASSR reference evaluator
    status: active
    rule: continue_without_creating_TDI8_2_surface
  - id: TDI8_2
    name: Confirmatory alternative architecture holdout
    status: future_human_only_not_authorized
    agent_policy: forbidden_to_initiate
  - id: TDI8_3_plus
    name: Evidence_justified architecture ablations robustness and transfer
    status: conditional
  - id: TDI9_0
    name: Autonomous adaptive inference dynamics preregistration
    status: complete_merged_frozen
    source: issue_92
    merge_evidence:
      - PR_122_merged_as_bb13c59aa91e3e5e2e6a480f4ae12adfe168221b
      - preregistration_blob_babad0a4e309e67e57820281a0f31284ba1e5da0_pinned
      - exact_head_c551c8b33f997cae733c106ec059799cb9b999c3_all_required_workflows_green
    scientific_question: >-
      Under a common bounded maximum-compute envelope, can an observation-conditioned
      inference policy preserve or improve solution quality while consuming less
      computation than fixed-budget inference, and does explicit verification plus
      backtracking/recovery add incremental value beyond adaptive stopping alone?
    policy_ladder:
      - C0_fixed_compute_budget
      - C1_static_task_class_preallocation
      - C2_observation_conditioned_CONTINUE_or_STOP
      - C3_observation_conditioned_CONTINUE_VERIFY_BACKTRACK_or_STOP
    primary_contrasts:
      - H9_A_C2_vs_C0
      - H9_B_C3_vs_C2
    autonomy_policy:
      - development_and_validation_are_agent_driven
      - no_human_confirmation_token_is_part_of_TDI9
      - final_confirmation_must_use_future_derived_entropy_frozen_before_reveal
      - result_conditioned_entropy_selection_retry_or_replacement_is_forbidden
  - id: TDI9_1
    name: Bounded autonomous adaptive inference evaluator
    status: active_authorized_after_TDI9_0_merge
    entry_gate_evidence:
      - TDI9_0_is_merged_and_blob_pinned
      - TDI9_bootstrap_passed_public_CI
      - no_TDI9_2_surface_exists
      - TDI7_2_and_TDI8_2_boundaries_remain_intact
    goals:
      - deterministic_trajectory_and_action_semantics
      - leakage_safe_policy_observation_schema
      - C0_C1_C2_C3_reference_policies
      - matched_max_compute_and_declared_memory_envelopes
      - actual_compute_verification_and_backtracking_accounting
      - typed_rejection_and_machine_readable_provenance
      - development_and_validation_search_without_final_entropy
  - id: TDI9_2
    name: Autonomous sealed confirmation
    status: future_not_armed
    prerequisite: TDI9_1_complete_frozen_and_CI_green
    execution_policy: autonomous_future_entropy_derived_no_human_token
    rule: no_final_seed_list_dataset_or_result_payload_exists_before_the_frozen_future_entropy_event
  - id: TDI9_3_plus
    name: Evidence_justified adaptive inference extensions
    status: conditional
    candidate_topics:
      - verifier_observable_ablation
      - verifier_disagreement
      - backtracking_granularity
      - memory_aware_stopping
      - tool_use_interleaving
      - conditional_routing_and_mixture_of_mechanisms
      - cross_task_and_cross_length_transfer
      - Forge_policy_search_after_leak_safe_contract
      - NNIS_and_ElasticXxx_promotion_after_reference_evidence
  - id: TDI10_0
    name: Generic Jacobi operator and shifted resolvent foundation
    status: complete_merged_qualified
    source: issue_141
    merge_evidence:
      - PR_142_merged_as_66542d3e4367079d47c029bf5ec953d19c13433d
      - exact_head_77f4320dad38e49125ceb262f85d5c0c53f25b18_all_required_workflows_green
    scientific_scope:
      - real_symmetric_tridiagonal_Jacobi_operators
      - shifted_positive_LDL_factorization
      - left_right_Schur_cavities
      - selected_Green_diagonal_and_first_off_diagonal
      - independent_small_dense_oracles
    evidence_policy:
      - finite_algebraic_identities_are_EXACT_under_declared_positive_pivot_conditions
      - floating_point_regressions_are_NUMERICAL_EVIDENCE_only
      - no_soft_edge_uniform_theorem_is_claimed
      - no_RH_claim_or_Riemann_specific_coefficient_is_permitted
  - id: TDI10_1
    name: Constant positive Toeplitz cavity reference
    status: complete_merged_qualified
    merge_evidence:
      - PR_143_merged_as_61a872da59fb427d86aa65762398850cd9d69f66
      - exact_head_426338113976bc041e289e57f8d6a696f81da76c_all_required_workflows_green
    exact_scope:
      - positive_symbol_condition_a_gt_2_abs_b
      - positive_stable_cavity_fixed_point_q
      - local_kappa_b2_over_q2
      - exact_two_sided_G00_and_G01
      - independent_Fourier_quadrature_implementation_check
    nonclaims:
      - no_finite_section_convergence
      - no_slowly_varying_error_bound
      - no_soft_edge_uniformity
  - id: TDI10_2
    name: Exact finite cavity-error transport
    status: complete_merged_qualified
    merge_evidence:
      - PR_144_merged_as_c57cdfe07341de1e3d47104f1b73dd32f3170c17
      - exact_head_a5af124063f37536509de9d1ad1127aa9e2f7757_all_required_workflows_green
    exact_identity:
      - E_i_equals_alpha_E_j_plus_delta
      - alpha_equals_edge_squared_over_Cj_qj
      - delta_equals_shifted_diagonal_minus_edge_squared_over_qj_minus_qi
    abstraction_boundary:
      - q_references_are_caller_supplied_positive_values
      - no_row_freezing_or_edge_averaging_convention_is_promoted
    nonclaims:
      - no_uniform_alpha_bound
      - no_cumulative_contraction
      - no_drift_rate_bound
      - no_soft_edge_theorem
  - id: TDI10_3
    name: Exact drift and transport-factor factorization
    status: complete_merged_qualified
    merge_evidence:
      - PR_145_merged_as_ac9410632a91e063b7811eacdc2a0b7cfc34c5a4
      - exact_head_be6f507688890913c6f2458f5ebd2fb0b5ae9759_all_25_workflows_green
    exact_scope:
      - delta_equals_reference_defect_plus_edge_drift_plus_reference_drift
      - alpha_equals_normalized_edge_square_times_cavity_correction
      - local_reference_defect_is_preserved_explicitly
      - reference_edge_is_caller_supplied_finite_metadata
    nonclaims:
      - no_uniform_contraction
      - no_asymptotic_rate
      - no_slowly_varying_theorem
      - no_soft_edge_theorem
  - id: TDI10_4
    name: Exact finite cavity-error chain unrolling
    status: qualified_ready_for_merge_PR_146
    qualification_evidence:
      - PR_146_exact_head_7402601bfca559ad3f898b614cedbead830e3d55
      - all_26_pull_request_workflows_green_on_exact_head
      - dedicated_TDI10_4_gate_green_on_Rust_1_97_1
    exact_identity:
      - E_n_equals_A_n_E_0_plus_B_n
      - A_n_equals_product_of_step_transport_factors
      - B_n_equals_weighted_sum_of_step_drifts
      - equivalent_affine_recurrence_Ak_alpha_k_Akm1_Bk_alpha_k_Bkm1_plus_delta_k
    integrity_boundary:
      - adjacent_cavity_reference_and_error_metadata_must_be_contiguous
      - nonfinite_cumulative_arithmetic_fails_closed
    nonclaims:
      - no_factor_or_product_is_claimed_less_than_one
      - no_uniform_contraction_or_boundary_error_decay
      - no_summable_drift_or_slowly_varying_bound
      - no_soft_edge_uniformity_or_double_scaling_theorem
  - id: TDI10_5_plus
    name: Nonuniform contraction counterexamples scaling and generic theorem research
    status: planned_not_authorized_until_TDI10_4_merge_and_explicit_followup_scope
    candidate_topics:
      - cumulative_nonuniform_transport_products
      - minimal_counterexamples_to_uniform_contraction
      - soft_edge_counterexamples
      - double_scaling_in_i_m_t
      - eigenvalues_only_and_pairwise_numerical_tools
      - theorem_for_declared_slowly_varying_Jacobi_class_or_minimal_counterexample
    forbid_until_authorized:
      - promoting_observed_pointwise_alpha_less_than_one_to_a_uniform_theorem
      - importing_RiemannBench_specific_coefficients_as_generic_hypotheses
      - claiming_soft_edge_uniformity_without_a_proved_remainder
  - id: TDIX
    name: Ecosystem evidence and reusable primitive bridge
    status: planned_parallel

agent_operating_protocol:
  must_read_this_file:
    - at_start_of_every_agent_session
    - before_any_preregistration_evaluator_or_final_evaluation_change
    - before_TDI8_architecture_or_evaluator_changes
    - before_TDI9_adaptive_inference_or_confirmation_changes
    - before_TDI10_operator_theory_asymptotic_or_cross_repository_changes
    - before_cross_repository_scientific_integration
    - before_opening_or_merging_scientific_PRs
  must_update_this_file:
    - when_a_TDI_stage_changes_status
    - when_a_confirmatory_result_is_frozen
    - when_a_follow_up_is_authorized_or_rejected
    - when_an_ecosystem_contract_changes
    - when_TDI8_or_TDI9_primary_scope_materially_changes
    - when_TDI10_scope_evidence_status_or_RiemannBench_boundary_materially_changes
  fail_closed: >-
    If this roadmap cannot be read, or if it conflicts with merged protocols,
    immutable manifests, frozen result records, or current default-branch state,
    do not make scientific-promotion, final-evaluation, preregistration,
    cross-repository, or merge decisions for the affected stage until
    coordination state is repaired. Never inspect a forbidden historical
    holdout merely to reconcile roadmap drift.
