mission:
  primary: >-
    Preserve TDI as a preregistered deterministic research programme while
    supporting autonomous AI-agent research. TDI-7.x remains the frozen
    attention/recovery lineage, TDI-8.x remains the recurrent/associative
    architecture programme, TDI-9.x is the distinct adaptive-inference
    dynamics programme, and TDI-10.x is the distinct generic operator/resolvent
    research line for Jacobi and slowly-varying tridiagonal operators.
  autonomy: >-
    Prefer autonomous hypothesis generation, bounded experimentation,
    falsification, implementation, CI, review and evidence-gated promotion.
    Human action is not a scientific primitive. Where a confirmatory protocol
    is intentionally agent-autonomous, anti-leakage must be enforced by frozen
    contracts and future-derived randomness rather than a human token.

