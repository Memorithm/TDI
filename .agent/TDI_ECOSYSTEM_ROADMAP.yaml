  - PREREGISTER_AND_FREEZE_PROTOCOL
  - IMPLEMENT_BOUNDED_EVALUATOR_WITHOUT_FINAL_EVALUATION
  - AUTONOMOUS_DEVELOPMENT_SEARCH_AND_FALSIFICATION
