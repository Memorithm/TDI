schema_version: 2
kind: tdi_ecosystem_agent_roadmap
status: active
last_updated: "2026-09-03T23:57+0200"
repository: Memorithm/TDI
intended_consumer: autonomous_coding_agent
merge_policy: never_merge_this_file_to_default_branch_unless_user_explicitly_requests

mission:
  primary: >-
    Preserve TDI as a preregistered deterministic research programme while
    supporting autonomous AI-agent research. TDI-7.x remains the frozen
    attention/recovery lineage, TDI-8.x remains the recurrent/associative
    architecture programme, and TDI-9.x is the distinct adaptive-inference
    dynamics programme.
  autonomy: >-
    Prefer autonomous hypothesis generation, bounded experimentation,
    falsification, implementation, CI, review and evidence-gated promotion.
    Human action is not a scientific primitive. Where a confirmatory protocol
    is intentionally agent-autonomous, anti-leakage must be enforced by frozen
    contracts and future-derived randomness rather than a human token.

verified_current_facts:
  - TDI_1_through_TDI_6_x_are_frozen_evidence_with_original_scope_and_limitations
  - TDI_7_x_is_the_attention_and_memory_research_series
  - TDI_7_2_is_complete_frozen_accessed_once_and_its_rerun_surface_is_retired
  - TDI_7_2_must_never_be_rerun_or_reinterpreted_by_later_series
  - TDI_8_0_is_merged_and_frozen_with_preregistration_blob_fe80e7053d89824a77ef6790794f6930d1b424e2
  - TDI_8_1_is_active_and_has_merged_A0_A1_A2_A3_symbolic_tasks_leakage_safe_execution_binary64_encoding_decision_rules_resampling_and_accounting_foundations
  - no_TDI_8_2_runner_token_seed_range_or_result_surface_exists
  - issue_92_tracks_the_active_TDI_9_x_adaptive_inference_programme
  - TDI_9_0_was_merged_by_PR_122_as_bb13c59aa91e3e5e2e6a480f4ae12adfe168221b
  - TDI_9_0_preregistration_blob_babad0a4e309e67e57820281a0f31284ba1e5da0_is_pinned_on_main
  - TDI_9_1_bounded_non_final_implementation_is_now_authorized
  - no_TDI_9_2_runner_final_seed_list_final_dataset_or_result_surface_exists
  - user_has_explicitly_prioritized_AI_agent_research_without_routine_human_intervention_for_TDI_9

scientific_invariants:
  - preregistration_precedes_confirmatory_execution
  - final_evaluation_derivation_rules_are_frozen_before_final_randomness_is_knowable
  - no_tuning_feature_metric_margin_or_task_change_after_final_evaluation_entropy_is_revealed
  - failed_harmful_equivalent_inconclusive_or_negative_results_are_never_renumbered_away
  - TDI_finite_state_findings_are_not_neural_architecture_findings_until_independently_demonstrated
  - architecture_and_policy_names_are_hypotheses_not_claims_of_novelty
  - complexity_memory_quality_compute_and_runtime_claims_require_separate_evidence
  - no_mechanism_is_promoted_from_toy_task_success_alone
  - final_evaluation_material_must_not_leak_into_candidate_generation_or_policy_tuning

agent_safety_rules:
  - autonomous_agents_must_never_rerun_TDI_7_2_or_access_its_protected_payload_for_later_series
  - autonomous_agents_must_never_create_access_or_execute_a_TDI_8_2_surface_while_TDI_8_1_is_active
  - TDI_7_2_and_TDI_8_2_retain_their_historical_or_frozen_human_only_policy
  - TDI_9_may_use_agent_autonomous_confirmation_only_if_its_frozen_protocol_derives_final_seeds_from_future_public_randomness_or_equivalent_future_immutable_entropy
  - the_TDI_9_future_entropy_value_must_be_unknowable_when_the_derivation_contract_is_frozen
  - TDI_9_agents_may_not_choose_replace_skip_or_retry_a_future_entropy_value_based_on_results
  - normal_development_CI_must_not_generate_TDI_9_2_results_before_the_frozen_future_entropy_event
  - agents_may_build_test_and_run_bounded_non_final_development_and_validation_paths
  - agents_may_verify_hash_chains_split_disjointness_provenance_and_guard_logic
  - agents_must_fail_closed_on_leakage_nonfinite_results_contract_drift_or_final_entropy_provenance_failure

ownership:
  role: dynamic_information_recovery_architecture_and_adaptive_inference_research_source_of_truth
  owns:
    - frozen_TDI_experiment_designs_preregistrations_and_results
    - tdi_core_finite_state_dynamics_and_exact_oracles
    - tdi_ai_intervention_recovery_abstractions
    - TDI_specific_dynamic_recovery_descriptors
    - bounded_reference_architecture_experiments
    - bounded_adaptive_inference_policy_experiments
    - TDI_specific_final_evaluation_derivation_and_provenance_contracts
  does_not_own:
    - ITD_structural_descriptor_semantics
    - FLAT_ATTENTION_execution_or_kernel_semantics
    - SciRust_general_reusable_primitives_after_promotion
    - ElasticXxx_resource_runtime_semantics
    - SLHAv2_KV_codec_or_DA_LUC_product_semantics
    - NNIS_GPU_runtime_or_kernel_semantics
    - Forge_candidate_search_or_selection_semantics
    - Hub_orchestration_or_Verify_verdict_semantics

control_loop:
  - DEFINE_FALSIFIABLE_QUESTION
  - PREREGISTER_AND_FREEZE_PROTOCOL
  - IMPLEMENT_BOUNDED_EVALUATOR_WITHOUT_FINAL_EVALUATION
  - AUTONOMOUS_DEVELOPMENT_SEARCH_AND_FALSIFICATION
  - VERIFY_SOFTWARE_ORACLES_GUARDS_SPLITS_AND_PROVENANCE
  - FREEZE_FINAL_DERIVATION_CONTRACT_BEFORE_FUTURE_ENTROPY
  - AUTONOMOUS_CONFIRMATORY_EXECUTION_IF_THE_SERIES_EXPLICITLY_ALLOWS_IT
  - FREEZE_RESULT_AND_PROVENANCE
  - PRESERVE_NEGATIVE_OR_NULL_RESULTS
  - OPEN_ONLY_EVIDENCE_JUSTIFIED_FOLLOW_UPS

ecosystem_interfaces:
  Memorithm/itd-simulator:
    relationship: comparative_experiment_harness_and_structural_diagnostics
    contract:
      - ITD_and_TDI_descriptors_remain_separate_candidate_information_sources
      - TDI_9_may_consume_versioned_trajectory_diagnostics_only_through_explicit_non_leaking_interfaces
      - ITD_must_not_reinterpret_TDI_frozen_results
  Memorithm/ADA:
    relationship: semantic_mechanism_discovery_and_falsification_partner
    contract:
      - ADA_may_propose_candidate_observables_verifiers_or_mechanisms
      - TDI_9_owns_frozen_adaptive_inference_evaluation_and_scientific_verdicts
      - final_evaluation_material_must_never_reach_ADA_candidate_generation
  Memorithm/Forge:
    relationship: downstream_execution_driven_candidate_search_engine
    contract:
      - Forge_search_begins_only_after_TDI_publishes_a_leak_safe_search_contract
      - search_uses_generation_and_validation_surfaces_separate_from_final_confirmation
      - Forge_scores_are_not_TDI_scientific_results
  Memorithm/FLAT-ATTENTION:
    relationship: execution_and_semantic_comparison_target
    contract:
      - TDI_evidence_may_reject_or_prioritize_candidate_semantics
      - optimized_kernel_promotion_requires_separate_correctness_and_performance_evidence
  Memorithm/NNIS:
    relationship: downstream_NVIDIA_execution_measurement_target
    contract:
      - real_device_latency_bandwidth_memory_energy_and_throughput_claims_require_NNIS_measurement
      - TDI_reference_results_do_not_imply_hardware_speedup
  Memorithm/ElasticXxx:
    relationship: downstream_runtime_adaptation_target
    contract:
      - TDI_9_may_export_evidence_qualified_stop_verify_backtrack_or_compute_allocation_policies
      - ElasticXxx_owns_production_resource_actuation_and_runtime_safety
  Memorithm/scirust:
    relationship: promotion_target_for_reusable_general_primitives
    contract:
      - promote_only_general_statistical_experiment_or_policy_primitives
      - keep_frozen_TDI_experiment_semantics_and_results_in_TDI
  Memorithm/riemann_ndim_bench:
    relationship: structured_operator_hypothesis_source
    rule: RiemannBench_supplies_operator_hypotheses_not_TDI_semantics

roadmap:
  - id: TDI7_2
    name: Confirmatory H_AI_1 final holdout
    status: complete_frozen_accessed_once_runner_retired
    agent_policy: forbidden_to_rerun_or_reinterpret
  - id: TDI8_0
    name: Recurrent associative architecture preregistration
    status: complete_merged_frozen
    primary_contrasts:
      - A2_vs_A1
      - A3_vs_A2
  - id: TDI8_1
    name: Bounded deterministic ASSR reference evaluator
    status: active
    rule: continue_without_creating_TDI8_2_surface
  - id: TDI8_2
    name: Confirmatory alternative architecture holdout
    status: future_human_only_not_authorized
    agent_policy: forbidden_to_initiate
  - id: TDI8_3_plus
    name: Evidence_justified architecture ablations robustness and transfer
    status: conditional
  - id: TDI9_0
    name: Autonomous adaptive inference dynamics preregistration
    status: complete_merged_frozen
    source: issue_92
    merge_evidence:
      - PR_122_merged_as_bb13c59aa91e3e5e2e6a480f4ae12adfe168221b
      - preregistration_blob_babad0a4e309e67e57820281a0f31284ba1e5da0_pinned
      - exact_head_c551c8b33f997cae733c106ec059799cb9b999c3_all_required_workflows_green
    scientific_question: >-
      Under a common bounded maximum-compute envelope, can an observation-conditioned
      inference policy preserve or improve solution quality while consuming less
      computation than fixed-budget inference, and does explicit verification plus
      backtracking/recovery add incremental value beyond adaptive stopping alone?
    policy_ladder:
      - C0_fixed_compute_budget
      - C1_static_task_class_preallocation
      - C2_observation_conditioned_CONTINUE_or_STOP
      - C3_observation_conditioned_CONTINUE_VERIFY_BACKTRACK_or_STOP
    primary_contrasts:
      - H9_A_C2_vs_C0
      - H9_B_C3_vs_C2
    autonomy_policy:
      - development_and_validation_are_agent_driven
      - no_human_confirmation_token_is_part_of_TDI9
      - final_confirmation_must_use_future_derived_entropy_frozen_before_reveal
      - result_conditioned_entropy_selection_retry_or_replacement_is_forbidden
  - id: TDI9_1
    name: Bounded autonomous adaptive inference evaluator
    status: active_authorized_after_TDI9_0_merge
    entry_gate_evidence:
      - TDI9_0_is_merged_and_blob_pinned
      - TDI9_bootstrap_passed_public_CI
      - no_TDI9_2_surface_exists
      - TDI7_2_and_TDI8_2_boundaries_remain_intact
    goals:
      - deterministic_trajectory_and_action_semantics
      - leakage_safe_policy_observation_schema
      - C0_C1_C2_C3_reference_policies
      - matched_max_compute_and_declared_memory_envelopes
      - actual_compute_verification_and_backtracking_accounting
      - typed_rejection_and_machine_readable_provenance
      - development_and_validation_search_without_final_entropy
  - id: TDI9_2
    name: Autonomous sealed confirmation
    status: future_not_armed
    prerequisite: TDI9_1_complete_frozen_and_CI_green
    execution_policy: autonomous_future_entropy_derived_no_human_token
    rule: no_final_seed_list_dataset_or_result_payload_exists_before_the_frozen_future_entropy_event
  - id: TDI9_3_plus
    name: Evidence_justified adaptive inference extensions
    status: conditional
    candidate_topics:
      - verifier_observable_ablation
      - verifier_disagreement
      - backtracking_granularity
      - memory_aware_stopping
      - tool_use_interleaving
      - conditional_routing_and_mixture_of_mechanisms
      - cross_task_and_cross_length_transfer
      - Forge_policy_search_after_leak_safe_contract
      - NNIS_and_ElasticXxx_promotion_after_reference_evidence
  - id: TDIX
    name: Ecosystem evidence and reusable primitive bridge
    status: planned_parallel

agent_operating_protocol:
  must_read_this_file:
    - at_start_of_every_agent_session
    - before_any_preregistration_evaluator_or_final_evaluation_change
    - before_TDI8_architecture_or_evaluator_changes
    - before_TDI9_adaptive_inference_or_confirmation_changes
    - before_cross_repository_scientific_integration
    - before_opening_or_merging_scientific_PRs
  must_update_this_file:
    - when_a_TDI_stage_changes_status
    - when_a_confirmatory_result_is_frozen
    - when_a_follow_up_is_authorized_or_rejected
    - when_an_ecosystem_contract_changes
    - when_TDI8_or_TDI9_primary_scope_materially_changes
  fail_closed: >-
    If this roadmap cannot be read, or if it conflicts with merged protocols,
    immutable manifests, frozen result records, or current default-branch state,
    do not make scientific-promotion, final-evaluation, preregistration,
    cross-repository, or merge decisions for the affected stage until
    coordination state is repaired. Never inspect a forbidden historical
    holdout merely to reconcile roadmap drift.
