schema_version: 1
kind: tdi_ecosystem_agent_roadmap
status: active
last_updated: "2026-09-02T01:45+0200"
repository: Memorithm/TDI
intended_consumer: autonomous_coding_agent
merge_policy: never_merge_this_file_to_default_branch_unless_user_explicitly_requests

mission:
  primary: >-
    Preserve TDI as a preregistered, deterministic research programme for dynamic
    information and intervention-conditioned recovery, including the TDI-7.x
    attention/memory line and the newly authorized preparation of TDI-8.x for
    alternative recurrent/associative memory architectures, without retroactively
    reinterpreting frozen finite-state results or allowing software automation to
    bypass confirmatory holdout gates.
  ecosystem_goal: >-
    Supply scientifically disciplined dynamic-recovery descriptors, experiment
    schemas, architecture comparisons, and negative results to ITD Simulator,
    FLAT-ATTENTION, Forge and SciRust while keeping TDI's frozen experimental
    lineage authoritative for TDI claims.

verified_current_facts:
  - TDI_1_through_TDI_6_x_are_frozen_evidence_with_explicit_scope_and_limitations
  - TDI_7_x_is_the_attention_and_memory_research_series
  - TDI_7_1_is_complete_and_merged_with_the_official_completion_checklist_verified_by_PR_82
  - TDI_7_2_pre_holdout_population_seed_selection_and_rejection_policy_were_frozen_by_PR_84
  - TDI_7_2_final_holdout_runner_was_merged_by_PR_85
  - TDI_7_2_is_armed_but_fail_closed_and_the_final_holdout_has_not_been_accessed
  - TDI_7_2_execution_still_requires_an_explicit_human_supplied_confirmation_at_execution_time
  - confirmatory_full_runs_require_exact_human_confirmation_tokens
  - normal_tests_CI_and_the_authoring_agent_must_not_produce_confirmatory_full_run_results
  - TDI_finite_state_results_do_not_establish_transfer_to_transformers_or_other_neural_architectures
  - calibration_transfer_failures_and_negative_repair_results_are_preserved_as_measured_results
  - no_TDI_8_series_or_ASSR_repository_exists_yet_in_Memorithm_at_this_update
  - user_has_authorized_preparation_of_a_distinct_TDI_8_x_research_programme

scientific_invariants:
  - preregistration_precedes_confirmatory_implementation_and_holdout_access
  - final_holdout_is_untouched_until_the_frozen_evaluator_is_complete
  - no_tuning_feature_metric_margin_or_intervention_change_after_holdout_access
  - failed_harmful_equivalent_inconclusive_or_negative_results_are_never_renumbered_away
  - TDI_finite_state_findings_are_not_neural_architecture_findings_until_independently_demonstrated
  - MMI_definition_specific_atoms_are_not_represented_as_universal_empirical_results
  - calibration_transfer_failure_remains_explicit
  - dynamic_recovery_evidence_is_not_automatically_a_new_information_theoretic_invariant
  - software_version_and_scientific_series_numbering_are_distinct
  - architecture_names_are_hypotheses_not_claims_of_novelty
  - complexity_memory_quality_and_performance_claims_require_separate_measured_evidence
  - no_architecture_is_promoted_from_toy_task_success_alone

agent_safety_rules:
  - autonomous_agents_must_never_supply_confirmatory_full_run_tokens
  - autonomous_agents_must_never_execute_TDI_7_2_or_any_future_N_2_confirmatory_holdout_without_explicit_human_instruction_at_execution_time
  - autonomous_agents_may_build_test_and_run_bounded_non_holdout_preflight_paths
  - autonomous_agents_may_verify_frozen_hash_chains_and_guard_logic
  - autonomous_agents_must_fail_closed_if_a_command_would_access_a_forbidden_holdout_or_generate_a_confirmatory_result
  - TDI_8_work_must_not_read_generate_reuse_or_modify_TDI_7_2_final_holdout_data_or_authorization_surfaces

ownership:
  role: dynamic_information_recovery_and_architecture_research_source_of_truth
  owns:
    - frozen_TDI_experiment_designs_preregistrations_and_results
    - tdi_core_finite_state_dynamics_and_exact_oracles
    - tdi_ai_intervention_recovery_abstractions
    - TDI_specific_dynamic_recovery_descriptors_and_scientific_interpretation
    - bounded_reference_architecture_experiments_for_new_TDI_scientific_questions
    - confirmatory_holdout_guard_and_frozen_result_lineage
  does_not_own:
    - ITD_structural_descriptor_semantics
    - FLAT_ATTENTION_execution_or_kernel_semantics
    - SciRust_general_information_statistics_tensor_spectral_or_VSA_primitives_after_promotion
    - ElasticXxx_resource_runtime_semantics
    - SLHAv2_KV_codec_or_DA_LUC_product_semantics
    - NNIS_GPU_runtime_or_kernel_semantics
    - Forge_candidate_search_or_selection_semantics
    - Hub_orchestration_or_Verify_verdict_semantics

control_loop:
  - DEFINE_FALSIFIABLE_QUESTION
  - PREREGISTER_AND_FREEZE_PROTOCOL
  - IMPLEMENT_BOUNDED_EVALUATOR_WITHOUT_FINAL_HOLDOUT
  - VERIFY_SOFTWARE_ORACLES_GUARDS_AND_SPLIT_DISJOINTNESS
  - HUMAN_ONLY_CONFIRMATORY_EXECUTION_IF_AUTHORIZED
  - FREEZE_RESULT_AND_PROVENANCE
  - PRESERVE_NEGATIVE_OR_NULL_RESULTS
  - OPEN_ONLY_EVIDENCE_JUSTIFIED_FOLLOW_UPS

ecosystem_interfaces:
  Memorithm/itd-simulator:
    relationship: comparative_experiment_harness_and_AI_scientific_layer
    status: active_research_direction
    contract:
      - ITD_and_TDI_descriptors_are_separate_candidate_information_sources
      - every_joint_study_requires_explicit_ablation_against_each_other_and_competent_controls
      - ITD_must_not_reinterpret_TDI_frozen_results
  Memorithm/FLAT-ATTENTION:
    relationship: execution_target_for_candidate_attention_semantics_not_discovery_environment
    status: active_research_direction
    contract:
      - expose_reference_intermediate_state_for_controlled_interventions_in_research_mode
      - TDI_evidence_may_reject_or_prioritize_semantic_candidates
      - no_FLAT_GPU_optimization_is_promoted_from_mathematical_interest_or_TDI_signal_alone
      - FLAT_correctness_and_real_device_performance_gates_remain_separate
  Memorithm/Forge:
    relationship: downstream_execution_driven_candidate_search_engine
    status: planned_for_evidence_qualified_TDI_8_domains
    contract:
      - TDI_defines_and_freezes_scientific_oracles_tasks_and_admissible_architecture_semantics_first
      - Forge_may_search_parameters_or_implementations_only_after_a_bounded_domain_contract_exists
      - Forge_search_scores_are_not_TDI_scientific_results
      - holdout_data_and_confirmatory_oracles_must_never_leak_into_candidate_generation
  Memorithm/SLHAv2:
    relationship: separate_KV_compression_research_partner
    status: separate_programme
    contract:
      - DA_LUC_or_related_encoded_domain_KV_scoring_belongs_primarily_in_SLHAv2
      - TDI_may_later_measure_dynamic_recovery_effects_of_KV_representation_changes
      - TDI_does_not_own_SLHAv2_codec_or_tile_semantics
  Memorithm/NNIS:
    relationship: downstream_real_NVIDIA_execution_and_measurement_target
    status: planned_after_scientific_reference_validation
    contract:
      - NNIS_may_implement_evidence_qualified_recurrent_associative_or_memory_kernels
      - real_device_latency_bandwidth_memory_and_energy_claims_belong_to_measured_NNIS_evidence
      - TDI_toy_or_reference_results_do_not_imply_Thor_performance
  Memorithm/scirust:
    relationship: promotion_target_for_reusable_general_primitives
    status: active_conceptual_relationship
    contract:
      - promote_only_general_information_statistical_spectral_experiment_or_VSA_primitives
      - keep_TDI_frozen_experiment_semantics_and_results_in_TDI
  Memorithm/riemann_ndim_bench:
    relationship: structured_operator_hypothesis_source
    status: research_partner
    rule: RiemannBench_supplies_operator_hypotheses_not_TDI_semantics
  Memorithm/SciRust-Verify:
    relationship: future_evidence_ingestion_and_integrity_layer
    status: planned
    rule: preserve_preregistration_hash_chain_holdout_scope_and_scientific_verdict_without_claim_inflation
  Memorithm/scirust-hub:
    relationship: future_orchestration_of_bounded_non_confirmatory_tasks
    status: planned_not_assumed
    restriction: Hub_or_agents_must_not_automate_human_only_confirmatory_tokens

roadmap:
  - id: TDI7_1
    name: Deterministic attention evaluator and software-oracle gate
    status: complete_merged
    source: issue_57
    completion_evidence_2026_09_01:
      - PR_81_leakage_safe_early_recovery_features_merged_into_main
      - PR_82_official_completion_checklist_fully_checked_with_verification_record
      - readiness_gate_check_tdi7_1_readiness_sh_pass_on_stacked_head_74846ab
      - public_hosted_ci_green_and_tdi7_preflight_gates_green_on_each_head
      - workspace_tests_1134_passed_0_failed_locally
      - completion_did_not_access_TDI_7_2_final_holdout
  - id: TDI7_2
    name: Confirmatory H_AI_1 final holdout
    status: armed_fail_closed_human_only_not_executed
    prerequisite: TDI7_1_complete_reviewed_and_CI_green
    execution_policy: explicit_human_only_confirmation_at_execution_time
    agent_policy: forbidden_to_initiate
    decision_freeze_2026_09_01:
      - population_frozen_10000_generators_entire_frozen_range
      - seed_selection_frozen_contiguous_ascending_v1_over_7100030000_7100039999
      - rejection_policy_frozen_frozen_tdi71_typed_errors_v1
      - reference_TDI_7_2_HUMAN_DECISION_2026_09_01_CHECKUPAUTO
      - PR_84_froze_the_three_pre_holdout_decisions
    arming_evidence_2026_09_01:
      - PR_85_merged_the_singular_final_holdout_runner
      - runner_revalidates_frozen_decisions_before_work
      - runner_refuses_without_human_supplied_TDI7_CONFIRM_FINAL_HOLDOUT
      - normal_CI_never_supplies_the_token
      - final_holdout_still_NOT_ACCESSED_at_merge
    next_step: wait_for_explicit_human_instruction_at_execution_time
    execution_rule: >-
      Execution requires the human-supplied confirmation value at execution time.
      Autonomous agents must never supply the token, never execute the holdout,
      and never infer authorization from this roadmap or from the presence of the runner.
  - id: TDI7_3
    name: Intervention heterogeneity and coupling stability
    status: conditional_not_authorized
    rule: requires_new_preregistration_and_evidence_justification_from_TDI7_2_or_a_separate_mechanistic_need
  - id: TDI7_4
    name: Long_horizon_joint_information_and_synergy
    status: conditional_not_authorized
    rule: multiple_information_controls_and_no_MMI_identity_reinterpretation
  - id: TDI7_5_plus
    name: Static spectral insufficiency and FLAT semantic discrimination
    status: conditional_not_authorized
    rule: each_semantic_requires_frozen_math_scalar_reference_tests_controls_quality_and_cost_accounting
  - id: TDI8_0
    name: Alternative recurrent associative architecture preregistration
    status: active_preparation_authorized_2026_09_02
    scientific_question: >-
      Under matched bounded mechanistic tasks and declared resource budgets, does a
      recurrent state model augmented with explicit associative memory provide
      retrieval or long-horizon recovery advantages beyond competent attention-like
      and recurrent controls, and does an additional VSA/holographic workspace add
      incremental value beyond associative memory alone?
    provisional_architecture_ladder:
      - A0_competent_attention_like_reference
      - A1_recurrent_state_only_reference
      - A2_recurrent_state_plus_associative_memory_ASSR_candidate
      - A3_recurrent_state_plus_associative_memory_plus_VSA_workspace_ASSR_H_candidate
    required_preregistration_controls:
      - deterministic_reference_semantics_before_optimization
      - matched_task_splits_and_untouched_final_holdout
      - explicit_parameter_state_memory_and_operation_budget_accounting
      - identical_training_or_fitting_information_across_arms
      - associative_recall_and_copy_tasks_at_minimum
      - long_horizon_and_interference_stressors_defined_before_holdout
      - quality_memory_compute_and_runtime_claims_reported_separately
      - negative_equivalent_harmful_and_inconclusive_outcomes_preserved
      - no_claim_of_strict_O_N_or_constant_total_memory_without_formal_and_measured_scope
      - no_claim_of_VSA_dimension_level_interpretability
      - no_claim_that_token_prediction_or_decoding_is_eliminated_without_direct_evidence
    boundaries:
      - do_not_modify_or_consume_TDI7_2_final_holdout
      - do_not_create_a_new_ASSR_repository_before_TDI8_reference_evidence_justifies_product_ownership
      - do_not_send_unvalidated_architecture_candidates_to_Forge_for_search
      - do_not_promote_to_NNIS_FLAT_or_SciRust_before_reference_correctness_and_scientific_evidence
  - id: TDI8_1
    name: Bounded deterministic ASSR reference evaluator
    status: planned_after_TDI8_0_freeze
    goals:
      - implement_A0_A1_A2_and_A3_reference_semantics
      - expose_intervention_and_recovery_state_through_tdi_ai
      - verify_associative_memory_address_write_read_and_collision_semantics
      - verify_VSA_binding_bundling_and_unbinding_oracles_if_A3_is_retained
      - measure_exact_or_declared_state_and_external_memory_bytes
      - emit_machine_readable_provenance
      - run_only_train_development_validation_or_bounded_preflight_data
      - prove_CI_cannot_access_TDI8_2_final_holdout
  - id: TDI8_2
    name: Confirmatory alternative architecture holdout
    status: future_human_only_not_authorized
    prerequisite: TDI8_1_complete_reviewed_and_CI_green
    agent_policy: forbidden_to_initiate
    rule: requires_explicit_human_confirmation_at_execution_time_and_a_separately_frozen_holdout_protocol
  - id: TDI8_3_plus
    name: Evidence_justified architecture ablations robustness and transfer
    status: conditional_not_authorized
    candidate_topics:
      - associative_memory_capacity_and_collision_ablation
      - write_forget_gate_ablation
      - episodic_vs_semantic_memory_separation
      - VSA_incremental_value_and_binding_operator_controls
      - long_context_memory_growth_and_bounded_hot_memory_policies
      - cross_task_and_cross_length_transfer
      - Forge_parameter_search_only_after_oracle_and_holdout_isolation_contracts_exist
      - NNIS_real_device_implementation_only_after_reference_evidence
  - id: TDIX
    name: Ecosystem evidence and reusable primitive bridge
    status: planned_parallel
    goals:
      - version_machine_readable_TDI_AI_results_and_provenance
      - integrate_bounded_experiments_with_ITD
      - prepare_SciRust_Verify_ingestion
      - promote_only_general_reusable_primitives_to_SciRust

agent_operating_protocol:
  must_read_this_file:
    - at_start_of_every_agent_session
    - before_any_preregistration_evaluator_or_holdout_related_change
    - before_TDI8_architecture_or_evaluator_changes
    - before_ITD_FLAT_Forge_SLHAv2_NNIS_or_SciRust_integration
    - before_opening_or_merging_scientific_PRs
  must_update_this_file:
    - when_a_TDI_stage_changes_status
    - when_a_confirmatory_result_is_human_executed_and_frozen
    - when_a_follow_up_is_authorized_or_rejected
    - when_an_ecosystem_contract_changes
    - when_TDI8_architecture_ladder_controls_or_scope_materially_change
  fail_closed: >-
    If this roadmap cannot be read, do not make scientific-promotion, holdout,
    preregistration, cross-repository, or merge decisions. Never infer permission
    to execute a confirmatory run from roadmap availability alone.