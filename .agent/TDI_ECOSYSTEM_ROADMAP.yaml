  - normal_development_CI_must_not_generate_TDI_9_2_results_before_the_frozen_future_entropy_event
  - agents_may_build_test_and_run_bounded_non_final_development_and_validation_paths
  - agents_may_verify_hash_chains_split_disjointness_provenance_and_guard_logic
  - agents_must_fail_closed_on_leakage_nonfinite_results_contract_drift_or_final_entropy_provenance_failure
